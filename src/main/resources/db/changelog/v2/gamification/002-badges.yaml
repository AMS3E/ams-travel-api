# The nine badges — three tracks, three tiers each — and the windows they can
# be earned in: Cambodia's tourist seasons, the same four for every badge.
# A count starts again from zero when a new window opens; badges already
# earned stay in user_badges.
#
# Every column is spelled out rather than left to its default: the test run
# replays these statements against tables Hibernate made, which have none.
databaseChangeLog:
  - changeSet:
      id: v2-gamification-badges
      author: ams-travel-v2
      # Skipped on a fresh database: 007 replaced these tables with gamification.badges.
      preConditions:
        - onFail: MARK_RAN
        - tableExists: {schemaName: gamification, tableName: badge_definitions}
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO gamification.badge_definitions (id, code, name, description, icon_key, criteria_type, criteria_value, is_active, created_at) VALUES
                (${fn.uuid}, 'BROWSER_SILVER', 'Silver Browser', 'Open 300 destinations in one season (each place once a day)', 'compass', 'BROWSES', 300, TRUE, CURRENT_TIMESTAMP),
                (${fn.uuid}, 'BROWSER_GOLDEN', 'Golden Browser', 'Open 800 destinations in one season (each place once a day)', 'compass', 'BROWSES', 800, TRUE, CURRENT_TIMESTAMP),
                (${fn.uuid}, 'BROWSER_PLATINUM', 'Platinum Browser', 'Open 1,000 destinations in one season (each place once a day)', 'compass', 'BROWSES', 1000, TRUE, CURRENT_TIMESTAMP),
                (${fn.uuid}, 'REVIEWER_SILVER', 'Silver Reviewer', 'Publish 50 reviews in one season', 'pen', 'REVIEWS', 50, TRUE, CURRENT_TIMESTAMP),
                (${fn.uuid}, 'REVIEWER_GOLDEN', 'Golden Reviewer', 'Publish 400 reviews in one season', 'pen', 'REVIEWS', 400, TRUE, CURRENT_TIMESTAMP),
                (${fn.uuid}, 'REVIEWER_PLATINUM', 'Platinum Reviewer', 'Publish 1,000 reviews in one season', 'pen', 'REVIEWS', 1000, TRUE, CURRENT_TIMESTAMP),
                (${fn.uuid}, 'ADVENTURE_SILVER', 'Silver Adventurer', 'Collect 50 digital stamps on site in one season', 'stamp', 'STAMPS', 50, TRUE, CURRENT_TIMESTAMP),
                (${fn.uuid}, 'ADVENTURE_GOLDEN', 'Golden Adventurer', 'Collect 200 digital stamps on site in one season', 'stamp', 'STAMPS', 200, TRUE, CURRENT_TIMESTAMP),
                (${fn.uuid}, 'ADVENTURE_PLATINUM', 'Platinum Adventurer', 'Collect 1,000 digital stamps on site in one season', 'stamp', 'STAMPS', 1000, TRUE, CURRENT_TIMESTAMP);

              INSERT INTO gamification.badge_periods (id, badge_id, name, start_date, end_date, is_active)
              SELECT ${fn.uuid}, id, 'High season 2025/26', DATE '2025-11-01', DATE '2026-04-30', TRUE FROM gamification.badge_definitions;

              INSERT INTO gamification.badge_periods (id, badge_id, name, start_date, end_date, is_active)
              SELECT ${fn.uuid}, id, 'Green season 2026', DATE '2026-05-01', DATE '2026-10-31', TRUE FROM gamification.badge_definitions;

              INSERT INTO gamification.badge_periods (id, badge_id, name, start_date, end_date, is_active)
              SELECT ${fn.uuid}, id, 'High season 2026/27', DATE '2026-11-01', DATE '2027-04-30', TRUE FROM gamification.badge_definitions;

              INSERT INTO gamification.badge_periods (id, badge_id, name, start_date, end_date, is_active)
              SELECT ${fn.uuid}, id, 'Green season 2027', DATE '2027-05-01', DATE '2027-10-31', TRUE FROM gamification.badge_definitions;
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DELETE FROM gamification.badge_periods;
              DELETE FROM gamification.badge_definitions;
