# Verifying a destination is a BDO's job, and an administrator's.
#
# The user's rule (2026-09-23): "with verification only BDO and Admin can do".
# An editor reviews contributor drafts, publishes and moderates reviews, but no
# longer verifies a place on evidence, so PERM_VERIFIED_BADGE_SET leaves the
# EDITOR role. A BDO verifies every destination from now on — with the editors
# out, a contributor's place would otherwise wait for an administrator.
#
# The matching composites are in Permissions.deskComposites().
databaseChangeLog:
  - changeSet:
      id: v2-auth-verify-bdo-admin
      author: ams-travel-v2
      changes:
        - sql:
            sql: |
              DELETE FROM auth.role_permissions
              WHERE role_id IN (SELECT id FROM auth.roles WHERE code = 'EDITOR')
                AND permission_id IN (SELECT id FROM auth.permissions WHERE code = 'PERM_VERIFIED_BADGE_SET');
      rollback:
        - sql:
            sql: |
              INSERT INTO auth.role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM auth.roles r CROSS JOIN auth.permissions p
              WHERE r.code = 'EDITOR' AND p.code = 'PERM_VERIFIED_BADGE_SET'
                AND NOT EXISTS (
                  SELECT 1 FROM auth.role_permissions existing
                  WHERE existing.role_id = r.id AND existing.permission_id = p.id);
