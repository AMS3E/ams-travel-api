# Editors and BDOs publish too.
#
# Until now only an administrator held PERM_DESTINATION_PUBLISH: an editor could
# take a place off the public site but not put one on it, and a BDO could do
# neither — approving a request was the only route to publication. Both desks
# now hold the direct grant as well.
#
# A separate change set because 002 has already run everywhere.
databaseChangeLog:
  - changeSet:
      id: v2-auth-editor-bdo-publish
      author: ams-travel-v2
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO auth.role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM auth.roles r CROSS JOIN auth.permissions p
              WHERE r.code IN ('EDITOR', 'BDO') AND p.code = 'PERM_DESTINATION_PUBLISH'
                AND NOT EXISTS (
                  SELECT 1 FROM auth.role_permissions existing
                  WHERE existing.role_id = r.id AND existing.permission_id = p.id);
      rollback:
        - sql:
            sql: |
              DELETE FROM auth.role_permissions
              WHERE permission_id IN (SELECT id FROM auth.permissions WHERE code = 'PERM_DESTINATION_PUBLISH')
                AND role_id IN (SELECT id FROM auth.roles WHERE code IN ('EDITOR', 'BDO'));
