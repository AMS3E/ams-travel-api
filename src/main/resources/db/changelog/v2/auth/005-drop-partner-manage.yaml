# The permission that lost its endpoints.
#
# PERM_PARTNER_MANAGE guarded /partners and /partner-users. Both went when the
# partner dissolved into the listings it existed to create, so the permission
# now names nothing: no access rule reads it, and the API no longer declares
# the constant. A stored permission nothing checks reads like a rule that is
# enforced, which is worse than no row at all.
#
# The matching realm role is in Permissions, which the realm provisioner grants.
databaseChangeLog:
  - changeSet:
      id: v2-auth-drop-partner-manage
      author: ams-travel-v2
      changes:
        - sql:
            sql: |
              DELETE FROM auth.role_permissions
              WHERE permission_id IN (SELECT id FROM auth.permissions WHERE code = 'PERM_PARTNER_MANAGE');
              DELETE FROM auth.permissions WHERE code = 'PERM_PARTNER_MANAGE';
      rollback:
        - sql:
            sql: |
              INSERT INTO auth.permissions (id, code, name, description) VALUES
                (${fn.uuid}, 'PERM_PARTNER_MANAGE', 'Manage partners', 'Register partner businesses and name the people who act for them');
              INSERT INTO auth.role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM auth.roles r, auth.permissions p
              WHERE r.code IN ('BDO', 'ADMIN') AND p.code = 'PERM_PARTNER_MANAGE';
