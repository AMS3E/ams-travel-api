# The Khmer of the five seeded tourism corridors: name, short description, description.
# Fills only empty Khmer columns, so text an editor wrote is never overwritten.
databaseChangeLog:
  - changeSet:
      id: v2-corridor-khmer-text-rows
      author: ams-travel-v2
      dbms: postgresql
      changes:
        - sql:
            splitStatements: true
            sql: |
              UPDATE taxonomy.corridors c SET name_km = v.km FROM (VALUES
                ('khmer-civilization-trail', E'អារ្យធម៌ខ្មែរ'),
                ('mekong-civilization', E'អារ្យធម៌មេគង្គ'),
                ('coastal-paradise-route', E'ការរុករកតំបន់ឆ្នេរ'),
                ('cardamom-peaks-explorer', E'ការផ្សងព្រេងលើភ្នំ'),
                ('khmer-culinary', E'ម្ហូបអាហារខ្មែរ')
              ) AS v (slug, km)
              WHERE v.slug = c.slug AND c.name_km IS NULL;

              UPDATE taxonomy.corridors c SET short_description_km = v.km FROM (VALUES
                ('khmer-civilization-trail', E'រាជធានីបុរាណតាមលំដាប់លំដោយ ចាប់ពីអង្គររហូតដល់ចំណុចប្រសព្វទន្លេចតុមុខ។'),
                ('mekong-civilization', E'ភូមិបណ្ដែតទឹក កោះតម្បាញសូត្រ ផ្សោតទន្លេ និងផ្លូវទេសចរណ៍សហគមន៍នៅខ្សែទឹកខាងលើ។'),
                ('coastal-paradise-route', E'ដែនដីម្រេច ផ្សារក្ដាម និងកោះនានាក្នុងឈូងសមុទ្រ ក្នុងដំណើរតែមួយតាមបណ្ដោយឆ្នេរ។'),
                ('cardamom-peaks-explorer', E'ចេញពីរាជធានី ចូលទៅក្នុងព្រៃត្រូពិចនៃជួរភ្នំក្រវាញ ហើយបញ្ចប់នៅលើខ្ពង់រាបបូកគោ។'),
                ('khmer-culinary', E'ចម្អិន ភ្លក់ និងទិញគ្រឿងផ្សំ ចាប់ពីសៀមរាបរហូតដល់ឆ្នេរកំពត ដែនដីម្រេច។')
              ) AS v (slug, km)
              WHERE v.slug = c.slug AND c.short_description_km IS NULL;

              UPDATE taxonomy.corridors c SET description_km = v.km FROM (VALUES
                ('khmer-civilization-trail', E'រាជធានីបុរាណតាមលំដាប់លំដោយ ចាប់ពីអង្គររហូតដល់ចំណុចប្រសព្វទន្លេចតុមុខ។'),
                ('mekong-civilization', E'ជីវិតលើផ្ទៃទឹក ចាប់ពីទន្លេសាបរហូតដល់ទន្លេមេគង្គ៖ ភូមិបណ្ដែតទឹក កោះតម្បាញសូត្រ ផ្សោតទន្លេ និងផ្លូវទេសចរណ៍សហគមន៍នៅខ្សែទឹកខាងលើ។'),
                ('coastal-paradise-route', E'ដែនដីម្រេច ផ្សារក្ដាម និងកោះនានាក្នុងឈូងសមុទ្រ ក្នុងដំណើរតែមួយតាមបណ្ដោយឆ្នេរ។'),
                ('cardamom-peaks-explorer', E'ចេញពីរាជធានី ចូលទៅក្នុងព្រៃត្រូពិចនៃជួរភ្នំក្រវាញ ហើយបញ្ចប់នៅលើខ្ពង់រាបបូកគោ។'),
                ('khmer-culinary', E'ចម្អិន ភ្លក់ និងទិញគ្រឿងផ្សំ ចាប់ពីសៀមរាបរហូតដល់ឆ្នេរកំពត ដែនដីម្រេច៖ ថ្នាក់រៀនធ្វើម្ហូប ផ្សារគុយទាវ ភោជនីយដ្ឋានមួយនៅភ្នំពេញ ស្ករត្នោត ម្រេចកំពត និងផ្សារក្ដាមកែប។')
              ) AS v (slug, km)
              WHERE v.slug = c.slug AND c.description_km IS NULL;
