# What a stay offers, as one taxonomy the team manages instead of two fixed
# lists in code: each amenity is offered at the property, in the room, or at
# both, and a stay and a room store the slugs of theirs. The rows are the
# 34 property facilities and 47 room amenities the dashboard and the API used
# to carry, merged where they were the same thing (Wi-Fi, air conditioning…),
# so every saved stay and room keeps its ticks.
databaseChangeLog:
  - changeSet:
      id: v2-taxonomy-amenities
      author: ams-travel-v2
      changes:
        - createTable:
            schemaName: taxonomy
            tableName: amenities
            columns:
              - column: {name: id, type: uuid, defaultValueComputed: "${fn.uuid}", constraints: {primaryKey: true, primaryKeyName: amenities_pkey, nullable: false}}
              - column: {name: name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: slug, type: varchar(100), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_amenities_slug}}
              - column: {name: group_name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: icon_key, type: varchar(60)}
              - column: {name: level, type: varchar(20), constraints: {nullable: false}}
              - column: {name: sort_order, type: integer, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: is_active, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_by, type: uuid}
              - column: {name: created_at, type: timestamp with time zone, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
      rollback:
        - dropTable: {schemaName: taxonomy, tableName: amenities}
  # Every column is spelled out rather than left to its default: the test run
  # replays these statements against tables Hibernate made, which have none.
  - changeSet:
      id: v2-taxonomy-amenities-rows
      author: ams-travel-v2
