# An interest has an uploaded picture in place of its icon on the dashboard. Null until an
# editor chooses one; icon_key stays for the clients that still draw icons.
databaseChangeLog:
  - changeSet:
      id: v2-taxonomy-interest-cover
      author: ams-travel-v2
      changes:
        - addColumn:
            schemaName: taxonomy
            tableName: interests
            columns:
              - column: {name: cover_key, type: varchar(512)}
      rollback:
        - dropColumn: {schemaName: taxonomy, tableName: interests, columnName: cover_key}
