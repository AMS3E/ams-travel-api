# The Discover layer's first tab: tourism regions.
#
# `regions` now holds two kinds of row. A ZONE is geography — Angkor & the
# Tonle Sap, the South Coast — and is what the 25 provinces belong to, which is
# why `provinces.region_id` can stay a single NOT NULL column. A TOURISM region
# is a theme a visitor browses by — Ancient Capitals & Khmer Civilization,
# Luxury Tourism — and has no provinces of its own; it carries the categories
# its pages are shelved by and the tags its filter chips offer.
#
# Interests gain the group they are listed under (Attraction Sites, Stays,
# Food, Water, Activities & Experiences). The nine themed interests that
# predate the tourism regions have no group: they are not offered as interests.
databaseChangeLog:
  - changeSet:
      id: v2-taxonomy-tourism-regions
      author: ams-travel-v2
      changes:
        - addColumn:
            schemaName: taxonomy
            tableName: regions
            columns:
              - column: {name: kind, type: varchar(20), defaultValue: ZONE, constraints: {nullable: false}}
        - addColumn:
            schemaName: taxonomy
            tableName: interests
            columns:
              - column: {name: group_name, type: varchar(60)}

        - createTable:
            schemaName: taxonomy
            tableName: region_categories
            columns:
              - column: {name: region_id, type: uuid, constraints: {nullable: false}}
              - column: {name: category_id, type: uuid, constraints: {nullable: false}}
        - addPrimaryKey:
            schemaName: taxonomy
            tableName: region_categories
            columnNames: region_id, category_id
            constraintName: region_categories_pkey
        - addForeignKeyConstraint:
            baseTableSchemaName: taxonomy
            baseTableName: region_categories
            baseColumnNames: region_id
            constraintName: fk_region_categories_region
            referencedTableSchemaName: taxonomy
            referencedTableName: regions
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: taxonomy
            baseTableName: region_categories
            baseColumnNames: category_id
            constraintName: fk_region_categories_category
            referencedTableSchemaName: taxonomy
            referencedTableName: categories
            referencedColumnNames: id
            onDelete: CASCADE

        - createTable:
            schemaName: taxonomy
            tableName: region_tags
            columns:
              - column: {name: region_id, type: uuid, constraints: {nullable: false}}
              - column: {name: tag_id, type: uuid, constraints: {nullable: false}}
        - addPrimaryKey:
            schemaName: taxonomy
            tableName: region_tags
            columnNames: region_id, tag_id
            constraintName: region_tags_pkey
        - addForeignKeyConstraint:
            baseTableSchemaName: taxonomy
            baseTableName: region_tags
            baseColumnNames: region_id
            constraintName: fk_region_tags_region
            referencedTableSchemaName: taxonomy
            referencedTableName: regions
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: taxonomy
            baseTableName: region_tags
            baseColumnNames: tag_id
            constraintName: fk_region_tags_tag
            referencedTableSchemaName: taxonomy
            referencedTableName: tags
            referencedColumnNames: id
            onDelete: CASCADE
      rollback:
        - dropTable: {schemaName: taxonomy, tableName: region_tags}
        - dropTable: {schemaName: taxonomy, tableName: region_categories}
        - dropColumn: {schemaName: taxonomy, tableName: interests, columnName: group_name}
        - dropColumn: {schemaName: taxonomy, tableName: regions, columnName: kind}
