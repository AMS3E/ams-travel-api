# Ancient Capitals & Khmer Civilization's search filters are all tags now, as
# the user's data has them: Century, King, Architecture Style, UNESCO,
# Religion and Historical Period. Each of the five new ones is carried by the
# sites whose heritage answers it — the King tag by a site tied to a king.
#
# For a database seeded before them; a fresh one gets the tags and the links
# from the seed files, so this is marked run when there is no catalogue yet
# (a tag row written here would make the seed think it had already run).
databaseChangeLog:
  - changeSet:
      id: v2-taxonomy-heritage-tags
      author: ams-travel-v2
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: SELECT CASE WHEN count(*) > 0 THEN 1 ELSE 0 END FROM taxonomy.regions WHERE code = 'ANCIENT-CAPITALS'
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO taxonomy.tags (name, slug)
              SELECT v.name, v.slug
              FROM (VALUES
                ('Century', 'century'), ('King', 'king'), ('Architecture Style', 'architecture-style'),
                ('Religion', 'religion'), ('Historical Period', 'historical-period')
              ) AS v (name, slug)
              WHERE NOT EXISTS (SELECT 1 FROM taxonomy.tags t WHERE t.slug = v.slug);

              INSERT INTO taxonomy.region_tags (region_id, tag_id)
              SELECT r.id, t.id
              FROM taxonomy.regions r
              JOIN taxonomy.tags t ON t.slug IN ('century', 'king', 'architecture-style', 'religion', 'historical-period')
              WHERE r.code = 'ANCIENT-CAPITALS'
              ON CONFLICT DO NOTHING;

              INSERT INTO destination.destination_tags (destination_id, tag_id)
              SELECT d.id, t.id
              FROM destination.destinations d
              JOIN taxonomy.tags t ON (
                (t.slug = 'century' AND (
                  jsonb_array_length(COALESCE(d.centuries, '[]'::jsonb)) > 0
                  OR EXISTS (SELECT 1 FROM history.destination_monarchs m JOIN history.monarchs k ON k.id = m.monarch_id
                             WHERE m.destination_id = d.id AND k.reign_start_year IS NOT NULL)
                  OR EXISTS (SELECT 1 FROM history.destination_history h WHERE h.destination_id = d.id AND h.event_year IS NOT NULL)))
                OR (t.slug = 'king' AND EXISTS (SELECT 1 FROM history.destination_monarchs m WHERE m.destination_id = d.id))
                OR (t.slug = 'architecture-style' AND EXISTS (SELECT 1 FROM history.destination_architecture_styles s WHERE s.destination_id = d.id))
                OR (t.slug = 'religion' AND EXISTS (SELECT 1 FROM history.destination_religions g WHERE g.destination_id = d.id))
                OR (t.slug = 'historical-period' AND (
                  EXISTS (SELECT 1 FROM history.destination_periods p WHERE p.destination_id = d.id)
                  OR EXISTS (SELECT 1 FROM history.destination_history h WHERE h.destination_id = d.id AND h.historical_period_id IS NOT NULL))))
              WHERE d.theme = 'ANCIENT-CAPITALS'
              ON CONFLICT DO NOTHING;
      rollback:
        - sql:
            sql: DELETE FROM taxonomy.tags WHERE slug IN ('century', 'king', 'architecture-style', 'religion', 'historical-period');
  # What those tags answer, where the site's own history already says it: the
  # periods of its timeline, and the centuries of its timeline's years and of
  # its kings' reigns. The form then shows, under each ticked tag, which.
  - changeSet:
      id: v2-destination-heritage-answers
      author: ams-travel-v2
      dbms: postgresql
      changes:
        - sql:
            splitStatements: true
            sql: |
              INSERT INTO history.destination_periods (destination_id, historical_period_id)
              SELECT DISTINCT h.destination_id, h.historical_period_id
              FROM history.destination_history h
              JOIN destination.destinations d ON d.id = h.destination_id
              WHERE d.theme = 'ANCIENT-CAPITALS' AND h.historical_period_id IS NOT NULL
              ON CONFLICT DO NOTHING;

              WITH years AS (
                SELECT h.destination_id, h.event_year AS y FROM history.destination_history h WHERE h.event_year IS NOT NULL
                UNION
                SELECT m.destination_id, k.reign_start_year FROM history.destination_monarchs m
                JOIN history.monarchs k ON k.id = m.monarch_id WHERE k.reign_start_year IS NOT NULL
              ), chosen AS (
                SELECT destination_id, jsonb_agg(DISTINCT (y - 1) / 100 + 1 ORDER BY (y - 1) / 100 + 1) AS list
                FROM years WHERE y > 0 GROUP BY destination_id
              )
              UPDATE destination.destinations d SET centuries = chosen.list
              FROM chosen
              WHERE chosen.destination_id = d.id AND d.theme = 'ANCIENT-CAPITALS'
                AND jsonb_array_length(COALESCE(d.centuries, '[]'::jsonb)) = 0;
      rollback:
        - sql:
            sql: SELECT 1;
