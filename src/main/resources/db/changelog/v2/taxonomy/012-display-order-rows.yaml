              FROM (
                SELECT rt2.region_id, rt2.tag_id,
                       ROW_NUMBER() OVER (PARTITION BY rt2.region_id ORDER BY v.position NULLS LAST, t.name) - 1 AS position
                FROM taxonomy.region_tags rt2
                JOIN taxonomy.regions r ON r.id = rt2.region_id
                JOIN taxonomy.tags t ON t.id = rt2.tag_id
                LEFT JOIN (VALUES
                ('ANCIENT-CAPITALS', 'century', 0),
                ('ANCIENT-CAPITALS', 'king', 1),
                ('ANCIENT-CAPITALS', 'architecture-style', 2),
                ('ANCIENT-CAPITALS', 'unesco', 3),
                ('ANCIENT-CAPITALS', 'religion', 4),
                ('ANCIENT-CAPITALS', 'historical-period', 5),
                ('NORTHEASTERN', 'tribe', 0),
                ('NORTHEASTERN', 'forest', 1),
                ('NORTHEASTERN', 'elephant', 2),
                ('NORTHEASTERN', 'camping', 3),
                ('NORTHEASTERN', 'birding', 4),
                ('NORTHEASTERN', 'sesan', 5),
                ('NORTHEASTERN', 'srepok', 6),
                ('MEKONG-TONLE-SAP', 'boat', 0),
                ('MEKONG-TONLE-SAP', 'bird', 1),
                ('MEKONG-TONLE-SAP', 'fishing', 2),
