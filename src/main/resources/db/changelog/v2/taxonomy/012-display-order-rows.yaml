                ('MOUNTAIN-WATERFALL', 'mountain', 0),
                ('MOUNTAIN-WATERFALL', 'national-parks', 1),
                ('MOUNTAIN-WATERFALL', 'waterfalls', 2),
                ('MOUNTAIN-WATERFALL', 'cave', 3),
                ('MOUNTAIN-WATERFALL', 'trekking', 4),
                ('MOUNTAIN-WATERFALL', 'camping', 5),
                ('MOUNTAIN-WATERFALL', 'cycling', 6),
                ('MOUNTAIN-WATERFALL', 'viewpoint', 7),
                ('MOUNTAIN-WATERFALL', 'photography', 8),
                ('COASTAL-ISLAND', 'beach', 0),
                ('COASTAL-ISLAND', 'island', 1),
                ('COASTAL-ISLAND', 'coral', 2),
                ('COASTAL-ISLAND', 'diving', 3),
                ('COASTAL-ISLAND', 'seafood', 4),
                ('COASTAL-ISLAND', 'mangrove', 5),
                ('COASTAL-ISLAND', 'cruise', 6),
                ('COASTAL-ISLAND', 'snorkeling', 7),
                ('URBAN-LIFESTYLE', 'city-walk', 0),
