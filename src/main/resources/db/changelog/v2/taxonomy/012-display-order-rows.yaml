                ('URBAN-LIFESTYLE', 'street-food', 6),
                ('KHMER-CULINARY', 'traditional-food', 0),
                ('KHMER-CULINARY', 'michelin', 1),
                ('KHMER-CULINARY', 'street-food', 2),
                ('KHMER-CULINARY', 'fine-dining', 3),
                ('KHMER-CULINARY', 'cooking-class', 4),
                ('KHMER-CULINARY', 'farm', 5),
                ('ECO-COMMUNITY', 'homestay', 0),
                ('ECO-COMMUNITY', 'village', 1),
                ('ECO-COMMUNITY', 'craft', 2),
                ('ECO-COMMUNITY', 'agriculture', 3),
                ('ECO-COMMUNITY', 'eco-lodge', 4),
