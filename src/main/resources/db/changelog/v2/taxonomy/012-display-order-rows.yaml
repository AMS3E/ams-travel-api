              UPDATE taxonomy.corridors c SET sort_order = n.position
              FROM (
                SELECT c2.id, ROW_NUMBER() OVER (ORDER BY v.position NULLS LAST, c2.name) - 1 AS position
                FROM taxonomy.corridors c2
                LEFT JOIN (VALUES
