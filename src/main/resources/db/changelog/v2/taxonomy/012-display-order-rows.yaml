                ('LUXURY-TOURISM', 'luxury-hotel', 0),
                ('LUXURY-TOURISM', 'private-island', 1),
                ('LUXURY-TOURISM', 'golf', 2),
                ('LUXURY-TOURISM', 'helicopter', 3),
                ('LUXURY-TOURISM', 'yacht', 4),
                ('LUXURY-TOURISM', 'private-guide', 5),
                ('LUXURY-TOURISM', 'fine-dining', 6),
                ('LUXURY-TOURISM', 'spa', 7),
                ('LUXURY-TOURISM', 'vip-tour', 8)
                ) AS v (code, slug, position) ON v.code = r.code AND v.slug = c.slug
              ) n
              WHERE n.region_id = rc.region_id AND n.category_id = rc.category_id;

