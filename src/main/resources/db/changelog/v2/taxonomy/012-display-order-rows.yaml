                ('COASTAL-ISLAND', 'luxury-resort', 2),
                ('COASTAL-ISLAND', 'diving', 3),
                ('COASTAL-ISLAND', 'kayak', 4),
                ('URBAN-LIFESTYLE', 'cafe', 0),
                ('URBAN-LIFESTYLE', 'nightlife', 1),
                ('URBAN-LIFESTYLE', 'shopping', 2),
                ('URBAN-LIFESTYLE', 'music', 3),
                ('URBAN-LIFESTYLE', 'food', 4),
                ('URBAN-LIFESTYLE', 'architecture', 5),
                ('KHMER-CULINARY', 'khmer-curry', 0),
                ('KHMER-CULINARY', 'fish-amok', 1),
                ('KHMER-CULINARY', 'num-banh-chok', 2),
                ('KHMER-CULINARY', 'pepper-rice-wine', 3),
                ('KHMER-CULINARY', 'palm-sugar', 4),
                ('ECO-COMMUNITY', 'homestay', 0),
                ('ECO-COMMUNITY', 'community', 1),
                ('ECO-COMMUNITY', 'cycling', 2),
                ('ECO-COMMUNITY', 'farm', 3),
                ('ECO-COMMUNITY', 'local-food', 4),
                ('ECO-COMMUNITY', 'fishing', 5),
                ('LUXURY-TOURISM', 'luxury', 0),
                ('LUXURY-TOURISM', 'five-stars', 1),
                ('LUXURY-TOURISM', 'private', 2),
                ('LUXURY-TOURISM', 'exclusive', 3),
                ('LUXURY-TOURISM', 'helicopter', 4),
                ('LUXURY-TOURISM', 'golf-spa', 5)
                ) AS v (code, slug, position) ON v.code = r.code AND v.slug = t.slug
              ) n
              WHERE n.region_id = rt.region_id AND n.tag_id = rt.tag_id;

              UPDATE taxonomy.interests i SET sort_order = n.position
              FROM (
                SELECT i2.id, ROW_NUMBER() OVER (PARTITION BY i2.group_name ORDER BY v.position NULLS LAST, i2.name) - 1 AS position
                FROM taxonomy.interests i2
                LEFT JOIN (VALUES
                ('historical-sites', 0),
                ('culture', 1),
                ('national-parks', 2),
                ('cave', 3),
                ('luxury-hotel', 0),
                ('homestay', 1),
                ('resorts', 2),
                ('private-island', 3),
                ('eco-lodge', 4),
                ('restaurants', 0),
                ('markets', 1),
                ('drinks', 2),
