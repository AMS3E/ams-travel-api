# The curators' numbering for the rows already there (see 011-display-order.yaml).
#
# From the seed files, which follow it: each region, category, search filter,
# interest and corridor the seed knows takes its place; anything added since
# follows them A to Z. A fresh database is numbered by the seeders instead, so
# this finds nothing to do there. Positions count from 0; the link rows of each
# region are numbered 0, 1, 2… without gaps, as the region's ordered list needs.
databaseChangeLog:
  - changeSet:
      id: v2-taxonomy-display-order-rows
      author: ams-travel-v2
      dbms: postgresql
      changes:
        - sql:
            splitStatements: true
            sql: |
              UPDATE taxonomy.regions r SET sort_order = n.position
              FROM (
                SELECT r2.id, ROW_NUMBER() OVER (PARTITION BY r2.kind ORDER BY v.position NULLS LAST, r2.name) - 1 AS position
                FROM taxonomy.regions r2
                LEFT JOIN (VALUES
                ('CAPITAL', 0),
                ('ANGKOR', 1),
                ('NORTHEAST', 2),
                ('MEKONG', 3),
                ('COAST', 4),
                ('ANCIENT-CAPITALS', 0),
                ('NORTHEASTERN', 1),
                ('MEKONG-TONLE-SAP', 2),
                ('MOUNTAIN-WATERFALL', 3),
                ('COASTAL-ISLAND', 4),
                ('URBAN-LIFESTYLE', 5),
                ('KHMER-CULINARY', 6),
                ('ECO-COMMUNITY', 7),
                ('LUXURY-TOURISM', 8)
                ) AS v (code, position) ON v.code = r2.code
              ) n
              WHERE n.id = r.id;

              UPDATE taxonomy.region_categories rc SET sort_order = n.position
              FROM (
                SELECT rc2.region_id, rc2.category_id,
                       ROW_NUMBER() OVER (PARTITION BY rc2.region_id ORDER BY v.position NULLS LAST, c.name) - 1 AS position
                FROM taxonomy.region_categories rc2
                JOIN taxonomy.regions r ON r.id = rc2.region_id
                JOIN taxonomy.categories c ON c.id = rc2.category_id
                LEFT JOIN (VALUES
                ('ANCIENT-CAPITALS', 'ancient-cities', 0),
                ('ANCIENT-CAPITALS', 'temples', 1),
                ('ANCIENT-CAPITALS', 'archaeological-sites', 2),
                ('ANCIENT-CAPITALS', 'ancient-roads', 3),
                ('ANCIENT-CAPITALS', 'bridges', 4),
                ('ANCIENT-CAPITALS', 'hospitals', 5),
                ('ANCIENT-CAPITALS', 'museums', 6),
                ('NORTHEASTERN', 'indigenous-culture', 0),
                ('NORTHEASTERN', 'volcano-lake', 1),
                ('NORTHEASTERN', 'forest', 2),
                ('NORTHEASTERN', 'wildlife', 3),
                ('NORTHEASTERN', 'waterfalls', 4),
                ('NORTHEASTERN', 'sacred-mountain', 5),
                ('NORTHEASTERN', 'adventure', 6),
                ('NORTHEASTERN', 'coffee', 7),
                ('MEKONG-TONLE-SAP', 'floating-village', 0),
                ('MEKONG-TONLE-SAP', 'fishing', 1),
                ('MEKONG-TONLE-SAP', 'bird-sanctuary', 2),
                ('MEKONG-TONLE-SAP', 'river-island', 3),
                ('MEKONG-TONLE-SAP', 'rice', 4),
                ('MEKONG-TONLE-SAP', 'community', 5),
