                ('MEKONG-TONLE-SAP', 'festival', 7),
                ('MOUNTAIN-WATERFALL', 'hiking', 0),
                ('MOUNTAIN-WATERFALL', 'sunrise', 1),
                ('MOUNTAIN-WATERFALL', 'sunset', 2),
                ('MOUNTAIN-WATERFALL', 'camping', 3),
                ('MOUNTAIN-WATERFALL', 'trail', 4),
                ('MOUNTAIN-WATERFALL', 'peak', 5),
                ('MOUNTAIN-WATERFALL', 'landscape', 6),
                ('COASTAL-ISLAND', 'beach', 0),
