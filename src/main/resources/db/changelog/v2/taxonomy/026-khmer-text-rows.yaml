# The Khmer of the seeded regions, provinces, categories, tags and interests.
# Fills only empty Khmer columns, so text an editor wrote is never overwritten.
databaseChangeLog:
  - changeSet:
      id: v2-taxonomy-khmer-text-rows
      author: ams-travel-v2
      dbms: postgresql
      changes:
        - sql:
            splitStatements: true
            sql: |
              UPDATE taxonomy.regions r SET name_km = v.km FROM (VALUES
                ('ANCIENT-CAPITALS', E'រាជធានីបុរាណ និងអារ្យធម៌ខ្មែរ'),
                ('NORTHEASTERN', E'អារ្យធម៌ភូមិភាគឦសាន'),
                ('MEKONG-TONLE-SAP', E'អារ្យធម៌មេគង្គ និងទន្លេសាប'),
                ('MOUNTAIN-WATERFALL', E'តំបន់ភ្នំ និងទឹកធ្លាក់'),
                ('COASTAL-ISLAND', E'តំបន់ឆ្នេរ និងកោះ'),
                ('URBAN-LIFESTYLE', E'របៀបរស់នៅទីក្រុង និងជីវិតពេលរាត្រី'),
                ('KHMER-CULINARY', E'តំបន់ម្ហូបអាហារខ្មែរ'),
                ('ECO-COMMUNITY', E'អេកូទេសចរណ៍សហគមន៍'),
                ('LUXURY-TOURISM', E'ទេសចរណ៍ប្រណីត'),
                ('CAPITAL', E'ភ្នំពេញ និងវាលទំនាបកណ្ដាល'),
                ('ANGKOR', E'អង្គរ និងទន្លេសាប'),
                ('NORTHEAST', E'ខ្ពង់រាបភាគឦសាន'),
                ('MEKONG', E'តំបន់ទំនាបមេគង្គ'),
                ('COAST', E'ឆ្នេរភាគខាងត្បូង')
              ) AS v (code, km)
              WHERE v.code = r.code AND r.name_km IS NULL;

              UPDATE taxonomy.regions r SET description_km = v.km FROM (VALUES
                ('ANCIENT-CAPITALS', E'រាជធានីនៃចក្រភពខ្មែរ និងកេរដំណែលដែលបន្សល់ទុក៖ ទីក្រុងប្រាសាទ ផ្លូវ និងស្ពានដែលតភ្ជាប់គ្នា អារោគ្យសាលាដែលបម្រើប្រជាជន និងសារមន្ទីរដែលថែរក្សាកេរដំណែលទាំងនោះ។'),
                ('NORTHEASTERN', E'តំបន់ខ្ពង់រាបនៃខេត្តរតនគិរី មណ្ឌលគិរី និងស្ទឹងត្រែង៖ ភូមិជនជាតិដើមភាគតិច បឹងភ្នំភ្លើង ព្រៃដំរី និងទឹកធ្លាក់តាមដងទន្លេសេសាន និងស្រែពក។'),
                ('MEKONG-TONLE-SAP', E'ជីវិតលើផ្ទៃទឹក៖ ភូមិបណ្ដែតទឹក ដែននេសាទ ជម្រកសត្វស្លាប កោះកណ្ដាលទន្លេ និងតំបន់ស្រែស្រូវដែលទឹកជំនន់ផ្ដល់ជីជាតិ។'),
                ('MOUNTAIN-WATERFALL', E'ជួរភ្នំក្រវាញ ជួរភ្នំដំរី និងព្រះវិហារ៖ ឧទ្យានជាតិ រូងភ្នំ ផ្លូវដើរឡើងកំពូលភ្នំ និងទឹកធ្លាក់តាមផ្លូវ។'),
                ('COASTAL-ISLAND', E'ឈូងសមុទ្រថៃ៖ ឆ្នេរខ្សាច់ កោះ ផ្កាថ្មសមុទ្រ ព្រៃកោងកាង និងអាហារសមុទ្រនៅគ្រប់ទីកន្លែង។'),
                ('URBAN-LIFESTYLE', E'ភ្នំពេញ សៀមរាប និងបាត់ដំបង ពេលរាត្រី៖ ផ្សាររាត្រី បារលើដំបូល វិចិត្រសាល កាហ្វេ និងអាហារតាមផ្លូវ។'),
                ('KHMER-CULINARY', E'អ្វីដែលកម្ពុជាបរិភោគ និងកន្លែងដែលវាត្រូវបានចម្អិន៖ តុម្ហូបប្រពៃណី អាហារតាមផ្លូវ ភោជនីយដ្ឋានលំដាប់ខ្ពស់ ថ្នាក់រៀនធ្វើម្ហូប និងកសិដ្ឋានដែលផ្គត់ផ្គង់ទាំងអស់នោះ។'),
                ('ECO-COMMUNITY', E'ការធ្វើដំណើរដែលស្នាក់នៅក្នុងភូមិ៖ ការស្នាក់នៅផ្ទះអ្នកភូមិ សិប្បកម្ម និងកសិកម្ម ផ្ទះសំណាក់បែបអេកូ ការមើលសត្វស្លាប និងមគ្គុទ្ទេសក៍ក្នុងស្រុកដែលនាំផ្លូវអ្នក។'),
                ('LUXURY-TOURISM', E'កម្ពុជាបែបឯកជន៖ រមណីយដ្ឋានលើកោះ វាយកូនហ្គោល ស្ប៉ា ឧទ្ធម្ភាគចក្រ ឬទូកយ៉ុត និងមគ្គុទ្ទេសក៍ផ្ទាល់ខ្លួន។'),
                ('CAPITAL', E'រាជធានីនៅចំណុចប្រសព្វទន្លេចតុមុខ ព្រមទាំងវាលស្រែ កោះតម្បាញសូត្រ និងតំបន់ស្ករត្នោតជុំវិញ។'),
                ('ANGKOR', E'ប្រាសាទអង្គរ និងបឹងទន្លេសាបដ៏ធំដែលទឹកជំនន់ផ្ដល់ជីវិតដល់ប្រទេស ចាប់ពីសៀមរាបរហូតដល់បាត់ដំបង និងតំបន់ភ្នំភាគខាងលិច។'),
                ('NORTHEAST', E'ប្រាសាទលើកំពូលច្រាំងថ្ម បឹងភ្នំភ្លើង ផ្សោតទន្លេ និងព្រៃឈើរបស់ជនជាតិព្នង ចារ៉ាយ និងគ្រឹង។'),
                ('MEKONG', E'ទីប្រជុំជនមាត់ទន្លេ ចម្ការកៅស៊ូ និងវាលស្រែនៅខាងកើតទន្លេមេគង្គ រហូតដល់ព្រំដែនវៀតណាម។'),
                ('COAST', E'ចម្ការម្រេច ផ្សារក្ដាម ព្រៃត្រូពិចជួរភ្នំក្រវាញ និងកោះនានាក្នុងឈូងសមុទ្រថៃ។')
              ) AS v (code, km)
              WHERE v.code = r.code AND r.description_km IS NULL;

