# A tourism corridor's Khmer text, typed by hand beside the English as for
# attractions and regions. Null until an editor writes it; English untouched.
# Ported from the developer's visal branch on 2026-10-22.
databaseChangeLog:
  - changeSet:
      id: v2-corridor-khmer
      author: ams-travel-v2
      changes:
        - addColumn:
            schemaName: taxonomy
            tableName: corridors
            columns:
              - column: {name: name_km, type: varchar(200)}
              - column: {name: short_description_km, type: varchar(500)}
              - column: {name: description_km, type: text}
      rollback:
        - dropColumn:
            schemaName: taxonomy
            tableName: corridors
            columns:
              - column: {name: name_km}
              - column: {name: short_description_km}
              - column: {name: description_km}
