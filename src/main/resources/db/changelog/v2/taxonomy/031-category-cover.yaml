# A category's icon picture, beside its icon name: the line icons the design team drew,
# one per category (Kimleng, 2026-10-26). The pictures are seed images published to MinIO
# under general/ with the system uploader; a new database gets them from the category seed.
databaseChangeLog:
  - changeSet:
      id: v2-taxonomy-category-cover
      author: ams-travel-v2
      changes:
        - addColumn:
            schemaName: taxonomy
            tableName: categories
            columns:
              - column: {name: cover_key, type: varchar(512)}
      rollback:
        - dropColumn:
            schemaName: taxonomy
            tableName: categories
            columns:
              - column: {name: cover_key}
  # The seeded categories already in a database get their icon; one an editor gave a picture keeps it.
  - changeSet:
      id: v2-taxonomy-category-cover-rows
      author: ams-travel-v2
      changes:
        - sql:
            splitStatements: true
