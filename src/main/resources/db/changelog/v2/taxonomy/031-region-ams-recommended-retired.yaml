# Recommended by AMS Travel is gone: the product keeps one Verified badge, on
# destinations alone, so a tourism region carries no mark of its own.
databaseChangeLog:
  - changeSet:
      id: v2-taxonomy-region-ams-recommended-retired
      author: ams-travel-v2
      changes:
        - dropColumn: {schemaName: taxonomy, tableName: regions, columnName: ams_recommended}
      rollback:
        - addColumn:
            schemaName: taxonomy
            tableName: regions
            columns:
              - column:
                  name: ams_recommended
                  type: boolean
                  defaultValueBoolean: false
                  constraints: {nullable: false}
