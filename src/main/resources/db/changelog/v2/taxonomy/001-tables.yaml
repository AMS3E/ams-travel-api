# taxonomy: the words the catalogue is sorted by. Regions are Cambodia's
# tourism zones, each holding provinces; categories, tags and interests are
# attached to destinations and food; a corridor is a named route whose stops
# live in destination.corridor_destinations.
databaseChangeLog:
  - changeSet:
      id: v2-taxonomy-tables
      author: ams-travel-v2
      changes:
        - createTable:
            schemaName: taxonomy
            tableName: regions
            columns:
              - column: {name: id, type: uuid, defaultValueComputed: "${fn.uuid}", constraints: {primaryKey: true, primaryKeyName: regions_pkey, nullable: false}}
              - column: {name: name, type: varchar(150), constraints: {nullable: false}}
              - column: {name: code, type: varchar(20), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_regions_code}}
              - column: {name: parent_id, type: uuid}
              - column: {name: description, type: text}
              - column: {name: is_active, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableSchemaName: taxonomy
            baseTableName: regions
            baseColumnNames: parent_id
            constraintName: fk_regions_parent
            referencedTableSchemaName: taxonomy
            referencedTableName: regions
            referencedColumnNames: id
            onDelete: SET NULL

        - createTable:
            schemaName: taxonomy
            tableName: provinces
            columns:
              - column: {name: id, type: uuid, defaultValueComputed: "${fn.uuid}", constraints: {primaryKey: true, primaryKeyName: provinces_pkey, nullable: false}}
              - column: {name: region_id, type: uuid, constraints: {nullable: false}}
              - column: {name: name, type: varchar(150), constraints: {nullable: false}}
              # ISO 3166-2, e.g. KH-17 for Siem Reap.
              - column: {name: code, type: varchar(20), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_provinces_code}}
              - column: {name: country_code, type: varchar(5), defaultValue: KH, constraints: {nullable: false}}
              - column: {name: is_active, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}
        - createIndex:
            schemaName: taxonomy
            tableName: provinces
            indexName: idx_provinces_region
            columns:
              - column: {name: region_id}
        # A region that still holds provinces is not deleted; the API says 409.
        - addForeignKeyConstraint:
            baseTableSchemaName: taxonomy
            baseTableName: provinces
            baseColumnNames: region_id
            constraintName: fk_provinces_region
            referencedTableSchemaName: taxonomy
            referencedTableName: regions
            referencedColumnNames: id
            onDelete: RESTRICT

        - createTable:
            schemaName: taxonomy
            tableName: categories
            columns:
              - column: {name: id, type: uuid, defaultValueComputed: "${fn.uuid}", constraints: {primaryKey: true, primaryKeyName: categories_pkey, nullable: false}}
              - column: {name: name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: slug, type: varchar(100), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_categories_slug}}
              - column: {name: description, type: text}
              # An icon's name ("compass"), not an upload.
              - column: {name: icon_key, type: varchar(512)}
              - column: {name: sort_order, type: int, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: is_active, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}

        - createTable:
            schemaName: taxonomy
            tableName: tags
            columns:
              - column: {name: id, type: uuid, defaultValueComputed: "${fn.uuid}", constraints: {primaryKey: true, primaryKeyName: tags_pkey, nullable: false}}
              - column: {name: name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: slug, type: varchar(100), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_tags_slug}}
              - column: {name: description, type: text}
              - column: {name: is_active, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}

        - createTable:
            schemaName: taxonomy
            tableName: interests
            columns:
              - column: {name: id, type: uuid, defaultValueComputed: "${fn.uuid}", constraints: {primaryKey: true, primaryKeyName: interests_pkey, nullable: false}}
              - column: {name: name, type: varchar(100), constraints: {nullable: false}}
              - column: {name: slug, type: varchar(100), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_interests_slug}}
              - column: {name: description, type: text}
              - column: {name: icon_key, type: varchar(512)}
              - column: {name: is_active, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}

        - createTable:
            schemaName: taxonomy
            tableName: corridors
            columns:
              - column: {name: id, type: uuid, defaultValueComputed: "${fn.uuid}", constraints: {primaryKey: true, primaryKeyName: corridors_pkey, nullable: false}}
              - column: {name: name, type: varchar(200), constraints: {nullable: false}}
              - column: {name: slug, type: varchar(120), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_corridors_slug}}
              - column: {name: description, type: text}
              - column: {name: cover_key, type: varchar(512)}
              - column: {name: is_featured, type: boolean, defaultValueBoolean: false, constraints: {nullable: false}}
              - column: {name: is_active, type: boolean, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
      rollback:
        - dropTable: {schemaName: taxonomy, tableName: corridors}
        - dropTable: {schemaName: taxonomy, tableName: interests}
        - dropTable: {schemaName: taxonomy, tableName: tags}
        - dropTable: {schemaName: taxonomy, tableName: categories}
        - dropTable: {schemaName: taxonomy, tableName: provinces}
        - dropTable: {schemaName: taxonomy, tableName: regions}
