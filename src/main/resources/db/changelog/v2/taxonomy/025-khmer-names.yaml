# The Khmer names of regions, provinces, categories, tags and interests, and
# the Khmer summaries of regions and interests. Null until an editor writes them.
databaseChangeLog:
  - changeSet:
      id: v2-taxonomy-khmer-names
      author: ams-travel-v2
      changes:
        - addColumn:
            schemaName: taxonomy
            tableName: regions
            columns:
              - column: {name: name_km, type: varchar(150)}
              - column: {name: description_km, type: text}
        - addColumn:
            schemaName: taxonomy
            tableName: provinces
            columns:
              - column: {name: name_km, type: varchar(150)}
        - addColumn:
            schemaName: taxonomy
            tableName: categories
            columns:
              - column: {name: name_km, type: varchar(100)}
        - addColumn:
            schemaName: taxonomy
            tableName: tags
            columns:
              - column: {name: name_km, type: varchar(100)}
        - addColumn:
            schemaName: taxonomy
            tableName: interests
            columns:
              - column: {name: name_km, type: varchar(100)}
              - column: {name: description_km, type: text}
      rollback:
        - dropColumn:
            schemaName: taxonomy
            tableName: regions
            columns:
              - column: {name: name_km}
              - column: {name: description_km}
        - dropColumn: {schemaName: taxonomy, tableName: provinces, columnName: name_km}
        - dropColumn: {schemaName: taxonomy, tableName: categories, columnName: name_km}
        - dropColumn: {schemaName: taxonomy, tableName: tags, columnName: name_km}
        - dropColumn:
            schemaName: taxonomy
            tableName: interests
            columns:
              - column: {name: name_km}
              - column: {name: description_km}
