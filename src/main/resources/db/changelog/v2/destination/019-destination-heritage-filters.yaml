# An Ancient Capitals site's own search filters, chosen on its form: the
# centuries it was built or used in, and the historical periods it belongs to
# besides those its timeline names. Its kings stay in destination_monarchs,
# its architecture styles and religions in their own links.
databaseChangeLog:
  - changeSet:
      id: v2-destination-heritage-filters
      author: ams-travel-v2
      changes:
        - addColumn:
            schemaName: destination
            tableName: destinations
            columns:
              - column: {name: centuries, type: "${type.json}"}
        - createTable:
            schemaName: history
            tableName: destination_periods
            columns:
              - column: {name: destination_id, type: uuid, constraints: {nullable: false}}
              - column: {name: historical_period_id, type: uuid, constraints: {nullable: false}}
        - addPrimaryKey: {schemaName: history, tableName: destination_periods, columnNames: "destination_id, historical_period_id", constraintName: destination_periods_pkey}
        - addForeignKeyConstraint:
            baseTableSchemaName: history
            baseTableName: destination_periods
            baseColumnNames: destination_id
            constraintName: fk_destination_periods_destination
            referencedTableSchemaName: destination
            referencedTableName: destinations
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: history
            baseTableName: destination_periods
            baseColumnNames: historical_period_id
            constraintName: fk_destination_periods_period
            referencedTableSchemaName: history
            referencedTableName: historical_periods
            referencedColumnNames: id
            onDelete: CASCADE
      rollback:
        - dropTable: {schemaName: history, tableName: destination_periods}
        - dropColumn: {schemaName: destination, tableName: destinations, columnName: centuries}
