                ('tatai-waterfall', E'ទឹកធ្លាក់ធំទូលាយលើស្ទឹងតាតៃ នៅគែមភាគខាងត្បូងនៃជួរភ្នំក្រវាញ។\n\nជិះទូកពីស្ពាន។ ការធ្វើដំណើរតាមទន្លេ គឺជាពាក់កណ្ដាលនៃភាពរីករាយ។'),
                ('virachey-national-park', E'តំបន់ការពារធំជាងគេមួយរបស់កម្ពុជា លាតសន្ធឹងពីខ្ពង់រាបរតនគិរីរហូតដល់ព្រំដែនឡាវ។\n\nតំបន់សម្រាប់ដំណើរច្រើនថ្ងៃ។ ទៅជាមួយមគ្គុទ្ទេសក៍សហគមន៍ ឬកុំទៅតែម្ដង។'),
                ('yeak-laom-lake', E'បឹងរណ្ដៅភ្នំភ្លើងដែលមានរាងស្ទើរតែល្អឥតខ្ចោះ គ្រប់គ្រងដោយសហគមន៍ជនជាតិទំពួនក្នុងតំបន់។\n\nហែលទឹកពេលថ្ងៃត្រង់ នៅពេលផ្ទៃទឹករលោងដូចកញ្ចក់ និងមានពណ៌បៃតង។')
