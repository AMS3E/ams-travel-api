# The Khmer of the seeded attractions, for a database seeded before it existed.
# Fills only empty Khmer columns, so text an editor wrote is never overwritten.
databaseChangeLog:
  - changeSet:
      id: v2-destination-khmer-text-rows
      author: ams-travel-v2
      dbms: postgresql
      changes:
        - sql:
            splitStatements: true
            sql: |
              UPDATE destination.destinations d SET name_km = v.km FROM (VALUES
                ('angkor-golf-resort', E'រមណីយដ្ឋានវាយកូនហ្គោលអង្គរ'),
                ('angkor-wat', E'អង្គរវត្ត'),
                ('angkorian-royal-road', E'ផ្លូវហ្លួងសម័យអង្គរ'),
                ('battambang-bamboo-train', E'រថភ្លើងឫស្សី (ណូរី)'),
                ('banteay-chhmar-community', E'បន្ទាយឆ្មារ'),
                ('banteay-srei', E'បន្ទាយស្រី'),
                ('battambang-art-quarter', E'សង្កាត់សិល្បៈបាត់ដំបង'),
                ('bayon-temple', E'ប្រាសាទបាយ័ន'),
                ('bokor-mountain', E'ភ្នំបូកគោ'),
                ('bou-sra-waterfall', E'ទឹកធ្លាក់ប៊ូស្រា'),
                ('cardamom-mountains', E'ជួរភ្នំក្រវាញ'),
                ('central-market', E'ផ្សារធំថ្មី'),
                ('chi-phat', E'ជីផាត'),
                ('elephant-valley-project', E'គម្រោងជ្រលងដំរី'),
                ('kampi-dolphin-pool', E'អន្លង់ផ្សោតកំពី'),
                ('kampong-khleang', E'កំពង់ឃ្លាំង'),
                ('kampong-phluk', E'កំពង់ភ្លុក'),
                ('tonle-sap-floating-village', E'ភូមិបណ្ដែតទឹកកំពង់ភ្លុក'),
                ('kampong-speu-palm-sugar', E'ចម្ការស្ករត្នោតកំពង់ស្ពឺ'),
                ('kampot-pepper-farm', E'ចម្ការម្រេចកំពត'),
                ('kampot-riverfront', E'មាត់ទន្លេកំពត'),
                ('kep-crab-market', E'ផ្សារក្ដាមកែប'),
                ('khmer-cooking-class-siem-reap', E'ថ្នាក់ធ្វើម្ហូបខ្មែរ សៀមរាប'),
                ('kirirom-national-park', E'ឧទ្យានជាតិគិរីរម្យ'),
                ('koh-dach-silk-island', E'កោះដាច់ (កោះសូត្រ)'),
                ('koh-ker', E'កោះកេរ្តិ៍'),
                ('koh-rong', E'កោះរ៉ុង'),
                ('koh-rong-sanloem', E'កោះរ៉ុងសន្លឹម'),
                ('koh-tang', E'កោះតាង'),
                ('koh-trong', E'កោះទ្រង់'),
                ('malis-phnom-penh', E'ម្លិះ'),
                ('mekong-discovery-trail', E'ផ្លូវរុករកមេគង្គ'),
                ('mondulkiri-coffee-highlands', E'ខ្ពង់រាបកាហ្វេមណ្ឌលគិរី'),
                ('national-museum', E'សារមន្ទីរជាតិ'),
                ('num-banh-chok-markets', E'ផ្សារនំបញ្ចុកពេលព្រឹក'),
                ('otres-beach', E'ឆ្នេរអូរត្រេះ'),
                ('peam-krasop-mangrove', E'ដែនជម្រកព្រៃកោងកាងពាមក្រសោប'),
                ('phnom-chhnork-cave', E'រូងភ្នំឈ្នក់'),
                ('phnom-kulen', E'ភ្នំគូលែន'),
                ('phnom-penh-coffee-quarter', E'សង្កាត់កាហ្វេភ្នំពេញ'),
                ('phnom-penh-riverside', E'មាត់ទន្លេភ្នំពេញ'),
                ('phnom-sampeau', E'ភ្នំសំពៅ'),
                ('preah-khan-kompong-svay', E'ប្រាសាទព្រះខ័នកំពង់ស្វាយ'),
                ('preah-vihear-temple', E'ប្រាសាទព្រះវិហារ'),
                ('prek-toal-bird-sanctuary', E'ជម្រកសត្វស្លាបព្រែកទាល់'),
                ('ream-national-park', E'ឧទ្យានជាតិរាម'),
                ('romanear-waterfall', E'ទឹកធ្លាក់រមនា'),
                ('royal-palace', E'ព្រះបរមរាជវាំង'),
                ('russian-market', E'ផ្សារទួលទំពូង'),
                ('sambor-prei-kuk', E'សំបូរព្រៃគុក'),
                ('sesan-srepok-confluence', E'ប្រសព្វទន្លេសេសាន និងស្រែពក'),
                ('siem-reap-night-market', E'ផ្សាររាត្រីសៀមរាប'),
                ('song-saa-private-island', E'កោះឯកជនសង្សារ'),
                ('sora-sky-bar', E'បារលើដំបូលសូរ៉ា'),
                ('spean-praptos', E'ស្ពានប្រាប់ទោស'),
                ('ta-prohm', E'ប្រាសាទតាព្រហ្ម'),
                ('tatai-waterfall', E'ទឹកធ្លាក់តាតៃ'),
                ('virachey-national-park', E'ឧទ្យានជាតិវីរជ័យ'),
                ('yeak-laom-lake', E'បឹងយក្សឡោម')
              ) AS v (slug, km)
              WHERE v.slug = d.slug AND d.name_km IS NULL;

              UPDATE destination.destinations d SET description_km = v.km FROM (VALUES
                ('angkor-golf-resort', E'ទីលានវាយកូនហ្គោលប្រកួតជើងឯកដប់ប្រាំបីរន្ធ នៅជាយភាគខាងលិចនៃក្រុងសៀមរាប រចនាដោយ នីក ហ្វលដូ។\n\nលេងពេលព្រឹកព្រលឹម។ ត្រឹមម៉ោងដប់មួយ កម្ដៅថ្ងៃក្លាយជាឧបសគ្គធំបំផុតនៅលើទីលាន។'),
                ('angkor-wat', E'វិមានសាសនាធំជាងគេបំផុតលើពិភពលោក និងជានិមិត្តរូបជាតិរបស់កម្ពុជា។'),
                ('angkorian-royal-road', E'ផ្លូវហ្លួងប្រវែង ២២៥ គីឡូម៉ែត្រ ពីអង្គរឆ្ពោះទៅទិសខាងកើតរហូតដល់បាកាន ជាមួយស្ពាន ផ្ទះភ្លើង និងវិហារអារោគ្យសាលា។\n\nចក្រភពមួយងាយយល់បំផុតតាមរយៈផ្លូវថ្នល់របស់វា។'),
                ('battambang-bamboo-train', E'កម្រាលឫស្សីដាក់លើកង់រថភ្លើង រត់តាមផ្លូវដែកតែមួយដែលកោងរៀច។\n\nមធ្យោបាយធ្វើដំណើរច្នៃប្រឌិត ដែលនៅរស់រានយូរជាងផ្លូវដែកដែលខ្លួនខ្ចីប្រើ។'),
                ('banteay-chhmar-community', E'ទីក្រុងប្រាសាទដ៏ធំល្វឹងល្វើយរបស់ព្រះបាទជ័យវរ្ម័នទី៧ នៅភាគពាយ័ព្យ ជាមួយការស្នាក់នៅផ្ទះអ្នកភូមិរបស់សហគមន៍ ក្នុងភូមិក្បែរនោះ។\n\nប្រាង្គមុខ រានហាលចម្លាក់ព្រះលោកេស្វរៈ ហើយស្ទើរតែគ្មាននរណាផ្សេងទៀតនៅទីនោះ។'),
                ('banteay-srei', E'ថ្មភក់ពណ៌ផ្កាឈូកឆ្លាក់យ៉ាងល្អិតល្អន់ ដែលចម្លាក់នៅតែច្បាស់ក្រោយរយៈពេលមួយពាន់ឆ្នាំ។\n\nចម្លាក់ថ្មដ៏ល្អឯកបំផុតនៅកម្ពុជា ក្នុងទំហំតូចបំផុត។'),
                ('battambang-art-quarter', E'រាជធានីសិល្បៈនៃកម្ពុជា — វិចិត្រសាល សាលាសៀក និងស្ទូឌីយោសិប្បកម្ម ក្នុងផ្ទះល្វែងមាត់ស្ទឹង។\n\nផ្លូវផ្ទះល្វែងដែលរក្សាបានល្អបំផុតក្នុងប្រទេស ដោយមានវិចិត្រសាលនៅពីក្រោយទ្វាររបាំង។'),
                ('bayon-temple', E'ព្រះភក្ត្រថ្មដ៏ស្ងប់ស្ងាត់ពីររយ នៅចំកណ្ដាលអង្គរធំ។\n\nឈរនៅកណ្ដាលពេលថ្ងៃត្រង់ ហើយគ្រប់ទិសទីហាក់ដូចជាកំពុងសម្លឹងមកអ្នកវិញ។'),
                ('bokor-mountain', E'ខ្ពង់រាបលើភ្នំដ៏ត្រជាក់ ជាមួយអគារសម័យអាណានិគមដែលគេបោះបង់ចោល ក្នុងចំណោមអ័ព្ទ។\n\nបើកឡានឡើងពេលរសៀល ហើយមើលពពកចូលមកដល់។'),
                ('bou-sra-waterfall', E'ទឹកធ្លាក់ពីរជាន់ដែលខ្លាំងបំផុតនៅកម្ពុជា ស្ថិតនៅជ្រៅក្នុងទឹកដីជនជាតិព្នង។\n\nមកក្នុងរដូវវស្សា អ្នកនឹងឮសំឡេងវា មុននឹងឃើញវា។'),
                ('cardamom-mountains', E'ជួរភ្នំព្រៃត្រូពិចលាតសន្ធឹងពីឆ្នេរសមុទ្ររហូតដល់ព្រំដែនថៃ និងជាតំបន់ធម្មជាតិព្រៃផ្សៃបំផុតដែលនៅសល់ក្នុងកម្ពុជា។\n\nមិនមែនជាដំណើរមួយថ្ងៃទេ។ រៀបចំឱ្យបានត្រឹមត្រូវ ហើយទុកពេលបីថ្ងៃ។'),
                ('central-market', E'ផ្សារធំថ្មី — អគារដំបូលមូលរចនាបថអាតដេកូ សាងសង់ឆ្នាំ១៩៣៧ ដែលមានស្លាបតូបលក់ដូរបួនលាតចេញពីវា។\n\nឈរនៅក្រោមកណ្ដាលដំបូលមូល ហើយងើបមើលទៅលើ មុននឹងទិញអ្វីមួយ។'),
                ('chi-phat', E'ភូមិមួយនៅជួរភ្នំក្រវាញ ដែលបានងាកចេញពីការកាប់ឈើ និងការបរបាញ់សត្វខុសច្បាប់ មកដំណើរការអេកូទេសចរណ៍ផ្ទាល់ខ្លួន។\n\nកក់តាមរយៈការិយាល័យសហគមន៍ក្នុងភូមិ។ នោះហើយជាគំរូទាំងមូល។'),
                ('elephant-valley-project', E'ជម្រកមួយដែលដំរីធ្វើការចូលនិវត្តន៍ ត្រូវបានគេនាំដើរ មិនមែនជិះទេ។\n\nមើល មិនមែនជិះ — ការទស្សនាធ្វើឡើងតាមចិត្តរបស់ដំរី។'),
                ('kampi-dolphin-pool', E'អន្លង់ទឹកជ្រៅមួយក្នុងចំណោមអន្លង់ចុងក្រោយលើទន្លេមេគង្គ ដែលមានហ្វូងផ្សោតទឹកសាបអ៊ីរ៉ាវ៉ាឌីរស់នៅ។\n\nជិះទូកចែវ មិនមែនទូកម៉ាស៊ីនទេ។ អ្នកនឹងឃើញច្រើនជាង ហើយរំខានតិចជាង។'),
                ('kampong-khleang', E'ទីលំនៅធំជាងគេបំផុតក្នុងចំណោមទីលំនៅលើបឹង — ទីប្រជុំជននេសាទដែលកំពុងរស់រវើក មិនមែនជាកន្លែងឈប់សម្រាប់ដំណើរមួយថ្ងៃទេ។\n\nទូកតិចជាង ជីវិតច្រើនជាង។ មកពេលរសៀល ហើយនៅរង់ចាំមើលពន្លឺ។'),
                ('kampong-phluk', E'ភូមិផ្ទះសសរខ្ពស់ប្រាំមួយម៉ែត្រ ជាមួយព្រៃលិចទឹកនៅពីក្រោយ ដែលអ្នកអាចអុំទូកកាត់បាន។\n\nនៅរដូវប្រាំង អ្នកដើរនៅក្រោមផ្ទះដែលអ្នកធ្លាប់ជិះទូកកាត់កាលពីខែតុលា។'),
                ('tonle-sap-floating-village', E'ផ្ទះសសរខ្ពស់ឈរដប់ម៉ែត្រពីលើបាតបឹងនៅរដូវប្រាំង។\n\nទៅនៅចុងរដូវវស្សា នៅពេលដែលព្រៃលិចទឹកអាចជិះទូកចូលបាន។'),
                ('kampong-speu-palm-sugar', E'ដើមត្នោតដែលគេឡើងយកទឹកនៅពេលព្រលឹម ហើយរំងាស់នៅព្រឹកដដែល ក្នុងខេត្តដែលផ្ដល់ឈ្មោះដល់ស្ករនេះ។\n\nមើលគេឡើងដើមត្នោតមុនអាហារពេលព្រឹក ហើយអ្នកនឹងលែងទិញស្ករពណ៌ស្លេកទៀតហើយ។'),
                ('kampot-pepper-farm', E'វល្លិម្រេចដែលមានការការពារប្រភពដើម បេះដោយដៃ និងញែកតាមពណ៌។\n\nភ្លក់ម្រេចខ្ចីដែលទើបបេះពីដើមស្រស់ៗ យ៉ាងហោចណាស់ម្ដង។'),
                ('kampot-riverfront', E'ជួរផ្ទះល្វែងដែលបានជួសជុលឡើងវិញ បែរមុខទៅទន្លេដែលហូរយឺតៗ និងខ្នងភ្នំបូកគោ។\n\nជិះទូកមើលថ្ងៃលិច — ភ្នំនឹងធ្វើផ្នែកដែលនៅសល់។'),
                ('kep-crab-market', E'ក្ដាមសេះដែលគេលើកចេញពីលបក្នុងទឹករាក់ ហើយចម្អិនជាមួយម្រេចកំពត។\n\nក្ដាមឆាម្រេចខ្ចី បរិភោគនៅក្បែរមាត់សមុទ្រ។'),
                ('khmer-cooking-class-siem-reap', E'ថ្នាក់រៀនកន្លះថ្ងៃ ដែលចាប់ផ្ដើមនៅផ្សារ ហើយបញ្ចប់ដោយអាម៉ុកដែលអ្នកបុកគ្រឿងដោយខ្លួនឯង។\n\nម៉ោងដើរផ្សារនៅដើមថ្នាក់ មានតម្លៃស្មើនឹងការចម្អិនម្ហូប។'),
                ('kirirom-national-park', E'ឧទ្យានជាតិដំបូងរបស់កម្ពុជា — ព្រៃស្រល់លើខ្ពង់រាប ចម្ងាយពីរម៉ោងពីរាជធានី។\n\nដើមស្រល់នៅកម្ពុជា។ បោះជំរុំនៅលើនេះ អ្នកនឹងត្រូវការអាវរងា។'),
                ('koh-dach-silk-island', E'កោះមួយលើទន្លេមេគង្គ ចម្ងាយកន្លះម៉ោងពីរាជធានី ដែលគ្រួសារត្បាញនៅតែប្រើកីដៃ។\n\nជិះសាឡាង ជិះកង់ ហើយឈប់នៅកន្លែងណាដែលអ្នកឮសំឡេងកី។'),
                ('koh-ker', E'រាជធានីតែម្ភៃឆ្នាំប៉ុណ្ណោះ និងប្រាសាទពីរ៉ាមីតប្រាំពីរជាន់ជាភស្តុតាង។\n\nការសាកល្បងដ៏ខ្លីរបស់ចក្រភពមួយ ស្ថិតនៅតែឯងក្នុងព្រៃ។'),
                ('koh-rong', E'ឆ្នេរខ្សាច់សវែងៗ ទឹកសមុទ្រភ្លឺចែងចាំងពេលយប់ និងផ្លូវកៅស៊ូតិចតួចបំផុត។\n\nហែលទឹកក្រោយពេលងងឹតនៅឆ្នេរខាងកើត — ប្លង់តុងភ្លឺចែងចាំង។'),
                ('koh-rong-sanloem', E'កោះដែលស្ងប់ស្ងាត់ជាងក្នុងចំណោមកោះធំទាំងពីរ — ឈូងវែងមួយនៅខាងកើត និងឆ្នេរមើលថ្ងៃលិចនៅខាងលិច។\n\nដើរតាមផ្លូវព្រៃឆ្លងទៅឆ្នេរ Lazy Beach ដើម្បីមើលថ្ងៃលិច រួចដើរត្រឡប់មកវិញ។'),
                ('koh-tang', E'កោះមុជទឹកឆ្ងាយបំផុតរបស់កម្ពុជា — ចម្ងាយបួនម៉ោង និងមានទឹកថ្លាបំផុតក្នុងឈូងសមុទ្រ។\n\nតំបន់សម្រាប់ស្នាក់នៅលើទូកច្រើនថ្ងៃ។ ដំណើរមួយថ្ងៃមកទីនេះ ភាគច្រើនជាពេលវេលានៅលើទូក។'),
                ('koh-trong', E'កោះប្រវែងប្រាំបួនគីឡូម៉ែត្រលើទន្លេមេគង្គ ទល់មុខក្រុងក្រចេះ ព័ទ្ធជុំវិញដោយផ្លូវជិះកង់រាបស្មើតែមួយ។\n\nឆ្លងតាមសាឡាង ជួលកង់ ហើយចំណាយពេលរសៀលមួយនៅទីនោះ។'),
                ('malis-phnom-penh', E'ម្ហូបខ្មែរសម័យទំនើបដឹកនាំដោយមេចុងភៅ ក្នុងទីធ្លាសួនច្បារមួយក្បែរមហាវិថីនរោត្តម។\n\nភោជនីយដ្ឋានដែលបានបង្ហាញថា ម្ហូបខ្មែរអាចជាម្ហូបលំដាប់ខ្ពស់ ហើយនៅតែបង្ហាញបែបនោះរហូតមកដល់សព្វថ្ងៃ។'),
                ('mekong-discovery-trail', E'ផ្លូវជិះកង់តាមមាត់ទន្លេ កាត់តាមចម្ការកៅស៊ូ និងភូមិនៅលើកោះ។\n\nជិះជាដំណាក់ៗ — ការជិះសាឡាងគឺជាពាក់កណ្ដាលនៃភាពរីករាយ។'),
                ('mondulkiri-coffee-highlands', E'កាហ្វេរបស់កសិករខ្នាតតូច ដាំលើខ្ពង់រាបជុំវិញសែនមនោរម្យ ហើយលីង និងលក់នៅក្នុងក្រុង។\n\nកាហ្វេកម្ពុជាជាឧស្សាហកម្មតូចមួយ។ នេះជាកន្លែងដែលគេដាំវាភាគច្រើន។'),
                ('national-museum', E'បណ្ដុំរូបចម្លាក់ខ្មែរធំជាងគេបំផុត ដែលរក្សាទុកក្នុងអគារពណ៌ដីឥដ្ឋ។\n\nមើលរូបចម្លាក់នៅទីនេះជាមុនសិន — បន្ទាប់មកអ្នកនឹងយល់ពីប្រាសាទកាន់តែច្បាស់។'),
                ('num-banh-chok-markets', E'តូបពេលព្រឹកដែលអាហារពេលព្រឹកជាតិរបស់កម្ពុជា ត្រូវបានគេបញ្ចុក ស្ងោរ និងចាក់សម្លតាមការកុម្ម៉ង់។\n\nអស់មុនម៉ោងប្រាំបួន។ បន្លែស្រស់ដាក់ពីលើ គឺត្រូវតែមាន។'),
                ('otres-beach', E'ចុងឆ្នេរដ៏ស្ងប់ស្ងាត់លើដីគោក ល្អបំផុតពេលថ្ងៃលិច។\n\nឆ្នេរខ្សាច់ស្ងប់ស្ងាត់ចុងក្រោយនៅលើដីគោក។'),
                ('peam-krasop-mangrove', E'មាត់ទន្លេព្រៃកោងកាងទំហំម្ភៃបីពាន់ហិកតា ដែលមានស្ពានដើរលើសសរកាត់ឆ្លង។\n\nទៅពេលទឹកជោរ ហើយជិះទូកតាមព្រែក មិនមែនដើរលើស្ពានឈើទេ។'),
                ('phnom-chhnork-cave', E'រូងភ្នំថ្មកំបោរនៅខាងជើងក្រុងកំពត ដែលមានប្រាសាទឥដ្ឋតូចមួយចាស់ជាងអង្គរ។\n\nប្រាសាទមុនសម័យអង្គរ ឈរនៅក្នុងរូងភ្នំ ដោយមានថ្មកំបោរព្យួរពីពិដានដុះចូលទៅក្នុងវា។'),
                ('phnom-kulen', E'ភ្នំពិសិដ្ឋដែលចក្រភពខ្មែរត្រូវបានប្រកាសនៅឆ្នាំ ៨០២ នៃគ្រិស្តសករាជ។\n\nចម្លាក់នៅបាតស្ទឹងខាងលើទឹកធ្លាក់ គឺជាហេតុផលដែលគួរឡើង។'),
                ('phnom-penh-coffee-quarter', E'រោងលីងកាហ្វេ និងហាងកាហ្វេក្នុងផ្ទះល្វែងនៅបឹងកេងកង និងដូនពេញ ដែលអាចដើរលេងបានក្នុងមួយរសៀល។\n\nដាំនៅកម្ពុជា លីងនៅកម្ពុជា ចាក់ក្នុងផ្ទះល្វែងសម័យទសវត្សរ៍ឆ្នាំ១៩៦០។ សួរថាថ្ងៃនេះមានអ្វីខ្លះ។'),
                ('phnom-penh-riverside', E'មាត់ទន្លេព្រះស៊ីសុវត្ថិ តាមបណ្ដោយទន្លេចតុមុខ — ផ្លូវដើរកម្សាន្តដែលអ្នកទីក្រុងទាំងមូលមកដើរពេលល្ងាច។\n\nមកដល់មួយម៉ោងមុនថ្ងៃលិច ហើយដើរទៅទិសខាងជើង។ មាត់ទន្លេទាំងមូលនឹងពោរពេញដោយមនុស្សនៅពីក្រោយអ្នក។'),
                ('phnom-sampeau', E'ភ្នំថ្មកំបោរនៅក្រៅក្រុងបាត់ដំបង មានរូងភ្នំ វត្តលើកំពូលភ្នំ និងហ្វូងប្រចៀវហើរចេញពេលព្រលប់។\n\nទៅដល់មាត់រូងភ្នំមុនម៉ោងប្រាំមួយ។ សត្វប្រចៀវហើរចេញមកកន្លះម៉ោងមិនឈប់។'),
                ('preah-khan-kompong-svay', E'បរិវេណប្រាសាទធំជាងគេបំផុតដែលចក្រភពខ្មែរធ្លាប់សាងកំពែងព័ទ្ធ ជាមួយវិហារអារោគ្យសាលាមួយដែលរក្សាបានល្អបំផុត។\n\nគូទឹកប្រវែងប្រាំគីឡូម៉ែត្រ ហើយស្ទើរតែគ្មាននរណានៅទីនោះ។'),
                ('preah-vihear-temple', E'ប្រាសាទដែលលាតសន្ធឹងតាមអ័ក្សប្រវែង ៨០០ ម៉ែត្រ នៅលើគែមច្រាំងថ្មនៃជួរភ្នំដងរែក។\n\nផ្លូវឡើងទៅដល់ គឺជាចំណុចសំខាន់ — ឡើងយឺតៗ។'),
