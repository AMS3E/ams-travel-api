                ('sisowath-sunset-bar', E'បារថ្ងៃលិចស៊ីសុវត្ថិលាតសន្ធឹងលើដំបូលអគារកែងផ្លូវនៅមាត់កំពង់ បួនជាន់ពីលើផ្លូវដើរលេង ដោយទន្លេសាប និងទន្លេមេគង្គជួបគ្នានៅខាងមុខ និងដំបូលវាំងនៅខាងត្បូង។ មនុស្សមកនៅម៉ោងប្រាំកន្លះសម្រាប់ថ្ងៃលិច ហើយនៅបន្តសម្រាប់ក្រុមតន្ត្រី។ បញ្ជីស្រាក្រឡុកផ្អែកលើរសជាតិក្នុងស្រុក ជាមួយម៉ាហ្គារីតាម្រេចកំពត អំពិលសួ និងអូលហ្វាសិនស្រាស ហើយម៉ោងសប្បាយដល់ម៉ោងប្រាំពីរ។\n\nផ្ទះបាយធ្វើចានចែកគ្នា និងម្ហូបអាំង ពីសាច់គោចាក់ឈើគ្របម្រេចដល់ត្រីអាំងទាំងមូល។ ក្រុមតន្ត្រីលេងពីថ្ងៃព្រហស្បតិ៍ដល់សៅរ៍ ហើយឌីជេបន្តចុងសប្ដាហ៍ដល់ម៉ោងពីរ។ កក់តុនៅជាប់បង្កាន់ដៃ។'),
                ('street-240-bakery', E'ហាងនំបុ័ងផ្លូវ 240 បើកនៅឆ្នាំ 2011 នៅផ្លូវហាងប៊ូទិកមានម្លប់ឈើខាងក្រោយវាំង គ្រប់គ្រងដោយអ្នកដុតនំខ្មែរដែលរៀនជំនាញនៅលីយ៉ុង ហើយត្រឡប់មកផ្ទះវិញ។ ឡដុតដើរពីម៉ោងបួនព្រឹក និងម្ដងទៀតពេលថ្ងៃត្រង់ ដូច្នេះនំបុ័ងក្ដៅនៅពេលអាហារពេលព្រឹក និងថ្ងៃត្រង់ ក្រូសង់ ប៉ាំងអូសូកូឡា និងគ្វីញអាម៉ាន់អស់ឆាប់ នំប៉ាតេក្រូចឆ្មា និងផ្លែស្បៃនៅដល់រសៀល។\n\nពេលថ្ងៃត្រង់ តុនំបុ័ងសាំងវិច ពីប៉ាតេ និងបន្លែជ្រក់បែបនំប៉័ងកម្ពុជា ដល់ហាំ និងឈីសកុងតេ បម្រើការិយាល័យ និងវិចិត្រសាលតាមផ្លូវ ហើយកាហ្វេលីងនៅភ្នំពេញ។ តុពីរបីនៅចិញ្ចើមផ្លូវក្រោមដើមឈើគឺកន្លែងអង្គុយល្អបំផុត។'),
                ('kampot-pepper-crab-shack', E'ខ្ទមក្ដាមម្រេចកំពតជាភោជនីយដ្ឋានដំបូលស័ង្កសីនៅមាត់ទន្លេខាងជើងស្ពានចាស់ គ្រប់គ្រងដោយគ្រួសារអ្នកនេសាទដែលដឹកក្ដាមពីកែបរាល់ព្រឹក ហើយទុកក្នុងកញ្ច្រែងក្នុងទន្លេរហូតដល់មានអ្នកកុម្ម៉ង់។ មុខម្ហូបសញ្ញាគឺរបស់ឆ្នេរផ្ទាល់៖ ក្ដាមកាប់ ហើយឆាក្នុងខ្ទះជាមួយខ្ទឹមស ទឹកអយស្ទ័រ និងម្រេចខ្ចីកំពតស្រស់ទាំងកួរពីចម្ការដែលគ្រួសារមានភាគហ៊ុន។ បង្គាអំពិល មឹកអាំងជាមួយក្រូចឆ្មាអំបិល លៀសចំហុយជីរនាងវង និងអាម៉ុកត្រីបំពេញមុខម្ហូប ហើយស្រាបៀរត្រជាក់។\n\nតុអង្គុយលើរានហាលឈើពីលើទឹកបែរមុខទៅជួរភ្នំបូកគោ ដូច្នេះថ្ងៃលិចជាផ្នែកមួយនៃអាហារពេលល្ងាច។'),
                ('kampot-night-market-bites', E'ផ្សាររាត្រីខាងក្រោយមាត់ទន្លេកំពតពេញដោយរទេះរាល់ល្ងាច ហើយចង្ក្រានអាំងរបស់បងវុទ្ធីនៅចុងខាងទន្លេគឺជាកន្លែងមានជួររង់ចាំ។ សាច់ជ្រូកចាក់ឈើប្រឡាក់ស្លឹកគ្រៃ និងស្ករត្នោត ស្លាបមាន់ស្លទឹកត្រីស្អិត មឹកទាំងមូល និងត្រីទន្លេតូចៗដាក់លើធ្យូងពីម៉ោងបួនកន្លះ បម្រើលើក្រដាសជាមួយល្ហុងជ្រក់ និងទឹកជ្រលក់ម្ទេសក្នុងតម្លៃមួយ ឬពីរដុល្លារក្នុងមួយឈើ។ ប្រពន្ធគាត់ប្រើរទេះបង្អែមនៅក្បែរ៖ ចេកអាំងទាំងសំបកជាមួយទឹកការ៉ាមែលដូង ក្រឡាន និងនំផ្លែអាយ ដុំម្សៅអង្ករតូចៗក្នុងដូង។\n\nមនុស្សភាគច្រើនញ៉ាំឈរ ឬយកទៅជញ្ជាំងមាត់ទន្លេ។'),
                ('kep-crab-pier-restaurant', E'ផែក្ដាមកែបជាភោជនីយដ្ឋានទីបីតាមជួរផ្ទះខ្ពស់ខាងក្រោយផ្សារក្ដាម គ្រប់គ្រងដោយគ្រួសារលោកសែមតាំងពីឆ្នាំ 2008។ ទម្លាប់សាមញ្ញ៖ អ្នកដើរទៅកញ្ច្រែងក្នុងទឹករាក់ ជ្រើសក្ដាមរបស់អ្នក ព្រមតម្លៃតាមគីឡូ ហើយវាចូលខ្ទះក្នុងពីរបីនាទី។ ម្រេចខ្ចីកំពតជាបែបបុរាណ ប៉ុន្តែផ្ទះបាយក៏ធ្វើចំហុយស្លឹកគ្រៃ ទឹកអំពិល ស៊ុតប្រៃ ការី និងអាំងធម្មតាដែរ។ បង្គា មឹក លៀស និងត្រីទាំងមូលមកពីទូកដដែល។\n\nកម្រាលជាក្ដារលើទឹក ខ្យល់ចូលតាមជញ្ជាំង ហើយថ្ងៃលិចលើកោះទន្សាយធ្លាក់មកលើតុ។'),
                ('kep-plantation-cafe', E'ហាងកាហ្វេចម្ការកែបស្ថិតក្នុងសួននៅផ្លូវដែលឡើងទៅឧទ្យានជាតិ រានហាលមានម្លប់ក្នុងចំណោមដើមម្រេច ចំប៉ា និងចម្ការបន្លែដែលផ្គត់ផ្គង់ផ្ទះបាយ។ កាហ្វេមកពីមណ្ឌលគិរី ធ្វើដោយម៉ាស៊ីនតូច ហើយភេសជ្ជៈពិសេសគឺសូកូឡាក្ដៅដាក់ម្រេចក្រហមកំពតកិន។ អាហារថ្ងៃត្រង់ស្រាល៖ ញាំត្រីគ្របម្រេច ការីបន្លែជាមួយបាយ នំបុ័ងសាំងវិច និងស៊ុបប្រចាំថ្ងៃ បន្តដោយឈីសខេកផ្លែស្បៃ ឬហ្វ្លង់ស្ករត្នោត។\n\nហាងខាងក្រោយលក់ម្រេចបួនពណ៌របស់ចម្ការ អំបិលសមុទ្រកំពត ស្ករត្នោត និងយៈសាពូនមី វេចខ្ចប់សម្រាប់វ៉ាលី។ ពេលព្រឹកត្រជាក់ ភ្ញៀវថ្ងៃត្រង់មកដល់ក្រោយដើរផ្លូវលំ។'),
                ('bamboo-train-canteen', E'ហាងបាយនៅចុងផ្លូវរថភ្លើងឫស្សីជាជម្រកស្បូវជាមួយខ្ទះ ចង្ក្រានធ្យូង និងតុប្លាស្ទិកដប់ពីរ គ្រប់គ្រងដោយគ្រួសារដែលធ្វើស្រែតាមវាលដែលរថភ្លើងរត់កាត់។ អាហារគឺអ្វីដែលផ្ទះកសិករខ្មែរញ៉ាំពេលថ្ងៃត្រង់៖ បាយឆាស៊ុតសាច់ជ្រូក ត្រកួនឆាខ្ទឹមសទឹកអយស្ទ័រ មាន់អាំងក្រូចឆ្មាម្រេច សម្លម្ជូរពេលមានត្រី និងចានម្នាស់ និងស្វាយស្រស់។ ដូងខ្ចីកាប់ពីគំនរក្រោមតុ តម្លៃមួយដុល្លារ។\n\nគ្មានអ្វីសរសេរទុកទេ ចង្អុលទៅអ្វីដែលកំពុងចម្អិន ហើយវាមកដល់ក្នុងពីរបីនាទី មុនរថភ្លើងត្រឡប់ក្រោយ។'),
                ('battambang-heritage-bistro', E'ប៊ីស្ត្រូបេតិកភណ្ឌបាត់ដំបងបើកនៅឆ្នាំ 2017 ក្នុងផ្ទះល្វែងទសវត្សរ៍ 1920 នៅផ្លូវមាត់ស្ទឹង ការ៉ូ ជណ្ដើរឈើធ្នង់ និងទ្វារបង្អួចនៅដដែល ហើយជញ្ជាំងព្យួរគំនូរពីវិចិត្រសាលជិតខាង។ ផ្ទះបាយគ្រប់គ្រងដោយចុងភៅបាត់ដំបងដែលធ្លាប់ធ្វើការនៅលីយ៉ុង និងជំនួយចុងភៅពីភូមិ ហើយមុខម្ហូបផ្លាស់រវាងទាំងពីរ៖ ទាកុងហ្វីម្រេចខ្ចីកំពត ការីសារ៉ាម៉ាន់សាច់គោចម្អិនយឺតជាមួយនំបុ័ង អាម៉ុកត្រីបែបបុរាណ ប្រហុកខ្ទិះជាមួយបន្លែស្រស់ និងនំប៉ាតេសូកូឡាស្ករត្នោត។\n\nមានបញ្ជីស្រាបារាំងខ្លី ស្រាបៀរក្នុងស្រុក និងស្រាសបាត់ដំបងត្រាំខ្ញី។ អាហារថ្ងៃត្រង់ជាឈុតពីរមុខដែលបុគ្គលិកការិយាល័យក្នុងក្រុងចូលចិត្ត អាហារពេលល្ងាចស្ងាត់ជាង និងក្រោមពន្លឺទៀន។'),
                ('otres-beach-bbq', E'អាំងឆ្នេរអូត្រេសជាបារមាត់ឆ្នេរមួយក្នុងចំណោមពីរបីដែលនៅសល់លើខ្សាច់បន្ទាប់ពីការរុះរើ ផ្ទះបាយឈើ និងស្បូវដែលមានតុដាក់លើឆ្នេរ ហើយរុញថយពេលទឹកឡើង។ ទូកអ្នកនេសាទចូលចតនៅចុងខាងត្បូងរាល់ព្រឹក ហើយអ្វីដែលមកដល់ដាក់តាំង៖ ត្រីបារ៉ាគូដា ត្រីកាលាំងក្រហម មឹក បង្គាខ្លា និងក្ដាម តម្លៃតាមទម្ងន់ ហើយអាំងលើធ្យូងជាមួយជម្រើសប៊ឺខ្ទឹមស ម្រេចកំពត ឬទឹកប្រឡាក់ម្ទេសក្រូចឆ្មាខ្មែរ បម្រើជាមួយបាយ សាឡាដ និងបន្លែអាំង។\n\nម៉ោងសប្បាយស្រាក្រឡុក និងស្រាបៀរពីម៉ោងបួនដល់ប្រាំពីរ ថ្ងៃលិចនៅខាងមុខផ្ទាល់ ហើយក្រោយងងឹតគោមភ្លើងបើក ហើយតន្ត្រីឡើងបន្តិច។'),
                ('koh-rong-fisherman-shack', E'ខ្ទមអ្នកនេសាទកោះរ៉ុងគឺដូចឈ្មោះ៖ ផ្ទះគ្រួសារអ្នកនេសាទនៅចុងស្ងាត់នៃកោះតូច មានតុដប់ពីរក្រោមដំបូលស្បូវ និងត្រីចាប់បានថ្ងៃនោះក្នុងធុងទឹកកកក្បែរទ្វារ។ ឪពុកចេញមុនព្រលឹម ម្ដាយ និងកូនស្រីចម្អិន ហើយក្ដារខៀនផ្លាស់តាមទូក៖ ត្រីក្រពុម ត្រីកាម៉ុង មឹក ក្ដាម និងពេលខ្លះបង្កងមួយពីរ អាំងលើធ្យូងសំបកដូងជាមួយទឹកជ្រលក់ក្រូចឆ្មាអំបិល ចៀនទាំងមូលជាមួយខ្ទឹមស ឬធ្វើសម្លម្ជូរជាមួយម្នាស់ និងប៉េងប៉ោះ។ បាយ ញាំល្ហុង និងបន្លែឆាបំពេញ។\n\nកាតមិនប្រើបានទេ ហើយពេលត្រីអស់ ខ្ទមបិទ។'),
                ('kratie-riverfront-noodles', E'រាល់ព្រឹកមុនម៉ោងប្រាំ អ៊ុំស្រីរៀបរទេះក្រោមដើមអំពិលនៅមាត់ទន្លេក្រចេះ រវាងកំពង់សាឡាងកោះត្រុង និងផ្សារ ហើយដុតឆ្នាំងបី។ មួយជាគុយទាវ ទឹកស៊ុបឆ្អឹងជ្រូកលើមី ជាមួយសាច់ជ្រូកចិត និងបង្គាពីរបី មួយជាគុយទាវសាច់គោទឹកស៊ុបខ្មៅផ្កាចន្ទន៍ ទីបីជាបបរ បបរត្រីទន្លេជាមួយខ្ញី និងខ្ទឹមបំពង។ អ្វីៗទាំងអស់បម្រើជាមួយចានជីរ ក្រូចឆ្មា ម្ទេស និងសណ្ដែកបណ្ដុះ។\n\nអ្នកធ្វើការសាឡាងញ៉ាំមុន បន្ទាប់មកស្ត្រីផ្សារ បន្ទាប់មកអ្នកដំណើរទៅមើលផ្សោត។ ដល់ម៉ោងដប់ ឆ្នាំងទទេ។ ថ្ងៃរះលើកោះត្រុងពេលអ្នកញ៉ាំ។'),
