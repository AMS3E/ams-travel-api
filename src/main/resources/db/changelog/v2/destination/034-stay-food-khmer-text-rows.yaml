# The Khmer of the seeded stays and food places (2026-10-21), for a database
# seeded before it existed: name, slogan, who said it, About and address, written
# by hand. Fills only empty Khmer columns, so text an editor wrote is never
# overwritten. Stays have no slug and are matched by name.
databaseChangeLog:
  - changeSet:
      id: v2-stay-food-khmer-text-rows
      author: ams-travel-v2
      dbms: postgresql
      changes:
        - sql:
            splitStatements: true
            sql: |
              UPDATE destination.destination_stays s SET name_km = v.km FROM (VALUES
                ('Angkor Lotus Boutique Hotel', E'សណ្ឋាគារប៊ូទិកអង្គរឡូតាស់'),
                ('Ta Prohm Garden Villa', E'វីឡាសួនតាព្រហ្ម'),
                ('Siem Reap River Hostel', E'ហូស្ទែលមាត់ស្ទឹងសៀមរាប'),
                ('Kulen Hills Eco Lodge', E'អេកូឡដ្ជភ្នំគូលែន'),
                ('Kampong Phluk Stilt Homestay', E'ផ្ទះស្នាក់ជាមួយគ្រួសារកំពង់ភ្លុក'),
                ('Riverside Palace Hotel', E'សណ្ឋាគារវិមានមាត់ទន្លេ'),
                ('BKK1 Garden Guesthouse', E'ផ្ទះសំណាក់សួនបឹងកេងកង 1'),
                ('Chaktomuk Sky Residences', E'ចតុមុខស្កាយរេស៊ីដិន'),
                ('Silk Island River Lodge', E'ឡដ្ជមាត់ទន្លេកោះដាច់'),
                ('Kampot Pepper Estate Bungalows', E'ខ្ទមចម្ការម្រេចកំពត'),
                ('Bokor View Guesthouse', E'ផ្ទះសំណាក់ទេសភាពបូកគោ'),
                ('Kep Seaside Villa', E'វីឡាមាត់សមុទ្រកែប'),
                ('Otres Beach Resort & Spa', E'រមណីយដ្ឋាន និងស្ប៉ាឆ្នេរអូត្រេស'),
                ('Koh Rong Sunset Bungalows', E'ខ្ទមថ្ងៃលិចកោះរ៉ុង'),
                ('Sanloem Lazy Beach Hostel', E'ហូស្ទែលឆ្នេរឡេស៊ីកោះរ៉ុងសន្លឹម'),
                ('Battambang Colonial House', E'ផ្ទះសម័យអាណានិគមបាត់ដំបង'),
                ('Sen Monorom Hill Lodge', E'ឡដ្ជភ្នំសែនមនោរម្យ'),
                ('Kratie Mekong View Hotel', E'សណ្ឋាគារទេសភាពមេគង្គក្រចេះ'),
                ('Banlung Lake Guesthouse', E'ផ្ទះសំណាក់បឹងបានលុង'),
                ('Tatai River Ecolodge', E'អេកូឡដ្ជទន្លេតាតៃ')
              ) AS v (k, km)
              WHERE v.k = s.name AND s.name_km IS NULL;

              UPDATE destination.destination_stays s SET slogan_km = v.km FROM (VALUES
                ('Angkor Lotus Boutique Hotel', E'អាងហែលទឹក សួនច្បារ និងរ៉ឺម៉កដែលរង់ចាំនៅម៉ោងប្រាំ។'),
                ('Ta Prohm Garden Villa', E'អាងហែលទឹកផ្ទាល់ខ្លួន ទ្វាររបងផ្ទាល់ខ្លួន ហើយប្រាសាទនៅចម្ងាយម្ភៃនាទី។'),
                ('Siem Reap River Hostel', E'គ្រែប៉ោដ ដំបូលផ្ទះ និងស្ទឹងនៅចន្លោះអ្នកនិងសំឡេងរំខាន។'),
                ('Kulen Hills Eco Lodge', E'គេងនៅកន្លែងដែលទន្លេពិសិដ្ឋចាប់ផ្ដើម។'),
                ('Kampong Phluk Stilt Homestay', E'ញ៉ាំជាមួយគ្រួសារ ភ្ញាក់ជាមួយបឹង។'),
                ('Riverside Palace Hotel', E'ទន្លេនៅបង្អួចអ្នក ព្រះបរមរាជវាំងនៅជ្រុងផ្លូវ។'),
                ('BKK1 Garden Guesthouse', E'វីឡាមួយ សួនច្បារមួយ និងផ្សារនៅជ្រុងផ្លូវ។'),
                ('Chaktomuk Sky Residences', E'ផ្ទះបាយផ្ទាល់ខ្លួន នៅម្ភៃប្រាំបីជាន់ពីលើទន្លេ។'),
                ('Silk Island River Lodge', E'រៀនតម្បាញពេលថ្ងៃ ស្ដាប់សូរមេគង្គពេលយប់។'),
                ('Kampot Pepper Estate Bungalows', E'គេងក្នុងចំណោមដើមម្រេចដែលផ្ដល់រសជាតិដល់ឆ្នេរទាំងមូល។'),
                ('Bokor View Guesthouse', E'ភ្នំពីលើដំបូល ទន្លេពីមាត់ទ្វារ។'),
                ('Kep Seaside Villa', E'ផ្សារក្ដាមម៉ោងប្រាំពីរ អាងរបស់អ្នកម៉ោងប្រាំបួន សមុទ្រពេញមួយថ្ងៃ។'),
                ('Otres Beach Resort & Spa', E'ដីខ្សាច់ស្ងាត់ចុងក្រោយនៃដីគោក រក្សាទុកដូចដើម។'),
                ('Koh Rong Sunset Bungalows', E'ឆ្នេរប្រាំពីរគីឡូម៉ែត្រ ខ្ទមដប់ប្រាំមួយ ហើយថ្ងៃលិចសម្រាប់តែអ្នក។'),
                ('Sanloem Lazy Beach Hostel', E'គ្មានផ្លូវ គ្មានសេវាទូរស័ព្ទ គ្មានហេតុផលត្រូវប្រញាប់។'),
                ('Battambang Colonial House', E'ទ្វារបង្អួចឈើធ្នង់ កម្រាលការ៉ូ និងស្ទឹងសង្កែនៅក្រៅបង្អួច។'),
                ('Sen Monorom Hill Lodge', E'ស្រល់ អ័ព្ទ និងជើងក្រានភ្លើងនៅកម្ពស់ប្រាំបីរយម៉ែត្រ។'),
                ('Kratie Mekong View Hotel', E'មេគង្គនៅខាងមុខ ផ្សោតនៅផ្លូវខាងលើ។'),
                ('Banlung Lake Guesthouse', E'ផ្លូវដីក្រហមពេលថ្ងៃ អង្រឹងក្រោមដើមស្វាយចន្ទីពេលយប់។'),
                ('Tatai River Ecolodge', E'ទន្លេនៅមាត់ទ្វារ ជួរភ្នំក្រវាញនៅពីក្រោយខ្នង។')
              ) AS v (k, km)
              WHERE v.k = s.name AND s.slogan_km IS NULL;

              UPDATE destination.destination_stays s SET slogan_by_km = v.km FROM (VALUES
                ('Angkor Lotus Boutique Hotel', E'ម្ចាស់សណ្ឋាគារ'),
                ('Ta Prohm Garden Villa', E'ភ្ញៀវពីសិង្ហបុរីដែលត្រឡប់មកវិញ'),
                ('Siem Reap River Hostel', E'អ្នកដើរលេងស្ពាយកាបូបពីទីក្រុងលីយ៉ុង'),
                ('Kulen Hills Eco Lodge', E'ភ្ញៀវពីកំពង់ធំ'),
                ('Kampong Phluk Stilt Homestay', E'ភ្ញៀវពីភ្នំពេញ'),
                ('Riverside Palace Hotel', E'អគ្គនាយក'),
                ('BKK1 Garden Guesthouse', E'ភ្ញៀវស្នាក់នៅយូរពីទីក្រុងប៊ែរឡាំង'),
                ('Chaktomuk Sky Residences', E'អ្នកប្រឹក្សាដែលមានកិច្ចសន្យាបីខែ'),
                ('Silk Island River Lodge', E'ភ្ញៀវពីក្យូតូ'),
                ('Kampot Pepper Estate Bungalows', E'ភ្ញៀវពីឈៀងម៉ៃ'),
                ('Bokor View Guesthouse', E'ភ្ញៀវពីក្រុងព្រះសីហនុ'),
                ('Kep Seaside Villa', E'គ្រួសារពីហុងកុង'),
                ('Otres Beach Resort & Spa', E'ស្ថាបនិករមណីយដ្ឋាន'),
                ('Koh Rong Sunset Bungalows', E'អ្នកដំណើរពីភ្នំពេញ'),
                ('Sanloem Lazy Beach Hostel', E'ភ្ញៀវដែលស្នាក់នៅមួយសប្ដាហ៍'),
                ('Battambang Colonial House', E'ភ្ញៀវពីមែលប៊ន'),
                ('Sen Monorom Hill Lodge', E'ភ្ញៀវពីភ្នំពេញ'),
                ('Kratie Mekong View Hotel', E'ភ្ញៀវពីទីក្រុងហូជីមិញ'),
                ('Banlung Lake Guesthouse', E'ភ្ញៀវពីកំពង់ចាម'),
                ('Tatai River Ecolodge', E'ភ្ញៀវពីបាងកក')
              ) AS v (k, km)
              WHERE v.k = s.name AND s.slogan_by_km IS NULL;

              UPDATE destination.destination_stays s SET description_km = v.km FROM (VALUES
                ('Angkor Lotus Boutique Hotel', E'អង្គរឡូតាស់ស្ថិតក្នុងច្រកផ្លូវលំនៅឋានស្ងាត់នៅខាងកើតស្ទឹង ដើរដប់នាទីទៅផ្សារចាស់ និងជិះរ៉ឺម៉កម្ភៃនាទីទៅអង្គរវត្ត។ អគារនេះរចនាតាមបែបផ្ទះឈើខ្មែរក្នុងរូបរាងទំនើប មានដំបូលធំ កម្រាលឈើប្រណីត និងរបៀងបើកចំហជុំវិញអាងហែលទឹកអំបិល។ បន្ទប់ធំទូលាយសមនឹងតម្លៃ មានផ្កាឈូកទឹកភ្លៀង ម៉ាស៊ីនត្រជាក់ និងយ៉រមើលទៅសួន ឬអាង។\n\nភោជនីយដ្ឋានមានអាហារពេលព្រឹកខ្មែរ និងអឺរ៉ុប ហើយពេលល្ងាចមានមុខម្ហូបខ្លីៗជុំវិញអាម៉ុក និងសម្លការី។ ផ្នែកទទួលភ្ញៀវរៀបចំសំបុត្រចូលអង្គរ ការចេញដំណើរមើលថ្ងៃរះ និងមគ្គុទ្ទេសក៍មានអាជ្ញាប័ណ្ណ ហើយអ្នកបើករ៉ឺម៉ករបស់សណ្ឋាគារដឹកជិះវង់ប្រាសាទក្នុងតម្លៃថេរ។ ការដឹកពីអាកាសយានដ្ឋានឥតគិតថ្លៃសម្រាប់ការស្នាក់នៅពីរយប់ឡើង។'),
                ('Ta Prohm Garden Villa', E'វីឡាសួនតាព្រហ្មគឺជាផ្ទះឯកជនពីរខ្នងក្នុងសួនមានរបងព័ទ្ធ នៅវត្តដំណាក់ តំបន់ដើមឈើស្រស់បៃតងនៅខាងត្បូងស្ទឹង ដែលវីឡាចាស់ៗរបស់សៀមរាបឈរក្រោមម្លប់ដើមឈើ។ វីឡានីមួយៗមានអាងហែលទឹកផ្ទាល់ខ្លួន ផ្ទះបាយដែលមានគ្រឿងសម្រាប់អាហារពេលព្រឹក រានហាលសម្រាប់អាហារពេលល្ងាចយូរៗ និងអ្នកថែទាំផ្ទះដែលមករៀងរាល់ព្រឹក។ វីឡាតូចមានបន្ទប់គេងពីរសម្រាប់បួននាក់ វីឡាធំមានបន្ទប់គេងបួនសម្រាប់ប្រាំបីនាក់។\n\nអាចកក់ចុងភៅសម្រាប់អាហារពេលល្ងាចខ្មែរនៅលើរានហាល និងអ្នកបើកបរជាមួយរថយន្ត ឬរ៉ឺម៉កសម្រាប់ថ្ងៃទៅប្រាសាទ។ ដើរដប់នាទីតាមមាត់ស្ទឹងដល់កណ្ដាលក្រុង។ ភ្ញៀវត្រូវបានទទួលនៅអាកាសយានដ្ឋាន ហើយចុះឈ្មោះចូលស្នាក់នៅផ្ទះផ្ទាល់ មិនមែននៅតុទទួលភ្ញៀវទេ។'),
                ('Siem Reap River Hostel', E'ហូស្ទែលមាត់ស្ទឹងសៀមរាបស្ថិតក្នុងផ្ទះល្វែងកែច្នៃនៅផ្លូវមាត់ស្ទឹង ដើរប្រាំនាទីឆ្លងស្ពានថ្មើរជើងពីផាប់ស្ទ្រីត ប៉ុន្តែឆ្ងាយគ្រប់គ្រាន់ដើម្បីគេងលក់ស្រួល។ បន្ទប់រួមមានគ្រែបែបប៉ោដ ដែលមួយៗមានវាំងនន ភ្លើងអាន ព្រីពីរ និងទូសោធំល្មមដាក់កាបូបស្ពាយ ហើយមានបន្ទប់រួមសម្រាប់តែនារីនៅជាន់លើ។ បន្ទប់ឯកជនបួនសមសម្រាប់គូស្នេហ៍ដែលមានថវិកាតិច។\n\nរានហាលលើដំបូលគឺជាបេះដូងនៃកន្លែងនេះ៖ ស្រាបៀរថោក ទេសភាពស្ទឹង និងការជួបជុំរាល់យប់ដែលបញ្ចប់នៅម៉ោងដប់មួយ។ មានផ្ទះបាយរួម សេវាបោកគក់ និងធ្នើប្ដូរសៀវភៅ ហើយតុទេសចរណ៍លក់ការជិះរ៉ឺម៉ករួមទៅមើលថ្ងៃរះអង្គរ និងសំបុត្រឡានក្រុង និងទូកទៅបាត់ដំបង។'),
                ('Kulen Hills Eco Lodge', E'អេកូឡដ្ជភ្នំគូលែនស្ថិតនៅជើងភ្នំគូលែន ប្រហែលមួយម៉ោងកន្លះទៅទិសឦសាននៃក្រុងសៀមរាប ត្រង់កន្លែងដែលផ្លូវចាប់ផ្ដើមឡើងចូលព្រៃ។ ខ្ទមដប់ពីរខ្នងធ្វើពីឈើ និងស្បូវ ឈរលើជើងទម្រតាមជម្រាលពីលើអូរ មានរានហាលធំទូលាយ កង្ហារជំនួសម៉ាស៊ីនត្រជាក់ ទឹកក្ដៅពីថាមពលព្រះអាទិត្យ និងមុងលើគ្រែ។ ឡដ្ជនេះសាងសង់ជាមួយ និងមានបុគ្គលិកមួយផ្នែកមកពីភូមិជិតខាង ហើយមគ្គុទ្ទេសក៍ពីភូមិនាំដើរទៅទឹកធ្លាក់ ព្រះអង្គធំ និងទន្លេសហស្រលិង្គ។\n\nអាហារជាម្ហូបខ្មែរចម្អិនលើធ្យូង ជាមួយបន្លែពីសួន។ ពេលយប់ងងឹត ស្ងាត់ និងពោរពេញដោយសំឡេងកង្កែប។ ការមកទទួលពីសៀមរាបរៀបចំក្នុងតម្លៃថេរ។'),
                ('Kampong Phluk Stilt Homestay', E'គ្រួសារលោកជា រស់នៅកំពង់ភ្លុកអស់បួនជំនាន់មកហើយ ហើយតាំងពីឆ្នាំ 2015 ពួកគាត់ទទួលភ្ញៀវក្នុងបន្ទប់ពីរនៅខាងក្រោយផ្ទះខ្ពស់របស់គាត់។ បន្ទប់សាមញ្ញ៖ ពូកលើកម្រាលឈើរលោង មុង កង្ហារពេលម៉ាស៊ីនភ្លើងដើរ និងបន្ទប់ទឹករួមនៅខាងក្រោម។ អ្វីដែលអ្នកមករកគឺអ្វីផ្សេងទាំងអស់។ អ្នកញ៉ាំជាមួយគ្រួសារ ជួយធ្វើត្រី ហើយចេញទូករបស់គាត់ពេលព្រលឹមចូលព្រៃលិចទឹក។ រដូវប្រាំង អ្នកដើរក្រោមផ្ទះ និងឆ្លងទៅលើបាតបឹង។\n\nផ្ទះស្នាក់នេះចុះបញ្ជីជាមួយក្រុមទេសចរណ៍ឃុំ ហើយថ្លៃមួយផ្នែកចូលមូលនិធិភូមិ។ ទូកពីកំពង់ចតត្រូវបានរៀបចំនៅពេលកក់។'),
                ('Riverside Palace Hotel', E'សណ្ឋាគារវិមានមាត់ទន្លេឈរនៅមាត់កំពង់ត្រង់ចំណុចដែលទន្លេសាបជួបទន្លេមេគង្គ ដោយព្រះបរមរាជវាំងនៅចម្ងាយប្រាំនាទីទៅទិសខាងត្បូង។ បើកនៅឆ្នាំ 2011 និងជួសជុលថ្មីនៅឆ្នាំ 2023 វាដំណើរការជាសណ្ឋាគារទីក្រុងពេញសេវា៖ អាងហែលទឹក និងបារលើដំបូលមើលទៅទន្លេ បន្ទប់ទទួលភ្ញៀវកម្រិតខ្ពស់នៅជាន់លើបំផុត ស្ប៉ាជាមួយការព្យាបាលបែបខ្មែរ កន្លែងហាត់ប្រាណបើកម្ភៃបួនម៉ោង ភោជនីយដ្ឋានពីរ និងសាលធំសម្រាប់ពិធីមង្គលការ និងសន្និសីទ។\n\nបន្ទប់ធំ និងស្ងាត់នៅពីក្រោយកញ្ចក់ពីរជាន់ ភាគច្រើនមានទេសភាពទន្លេ ហើយបន្ទប់ស្វីតបន្ថែមបន្ទប់ទទួលភ្ញៀវ និងសេវាអ្នកបម្រើផ្ទាល់។ ផ្នែកទទួលភ្ញៀវរៀបចំមគ្គុទ្ទេសក៍ទៅរាជវាំង និងសារមន្ទីរ ការជិះទូកមើលថ្ងៃលិចពីកំពង់ខាងក្រោម និងរថយន្តទៅអាកាសយានដ្ឋានក្នុងម្ភៃនាទី។'),
                ('BKK1 Garden Guesthouse', E'ផ្ទះសំណាក់សួនបឹងកេងកង 1 គឺជាវីឡាពីរជាន់ពីទសវត្សរ៍ 1960 នៅផ្លូវតូចរវាងបឹងកេងកង និងផ្សារទួលទំពូង គ្រប់គ្រងដោយគ្រួសារលោកសុខតាំងពីឆ្នាំ 2012។ បន្ទប់ដប់ពីរសាមញ្ញ និងស្អាត មានកម្រាលការ៉ូ គ្រែរឹង និងជម្រើសកង្ហារ ឬម៉ាស៊ីនត្រជាក់ ហើយបើកទៅយ៉រ ឬសួន ដែលដើមស្វាយចាស់ពីរដើមផ្ដល់ម្លប់ដល់តុអាហារពេលព្រឹក។\n\nអ្នកស្រីសុខចម្អិនអាហារពេលព្រឹកខ្មែរតាមការបញ្ជាទិញក្នុងតម្លៃពីរបីដុល្លារ ហើយស្វាមីគាត់មានបញ្ជីហាងគុយទាវ និងហាងកាហ្វេក្នុងសង្កាត់។ កង់ខ្ចីជិះឥតគិតថ្លៃ រ៉ឺម៉កហៅក្នុងតម្លៃស្មោះត្រង់ ហើយសម្លៀកបំពាក់បោកគក់បានមកវិញក្នុងថ្ងៃតែមួយ។ ដើរដប់នាទីដល់ផ្សារ ជិះរ៉ឺម៉កបន្តិចដល់មាត់ទន្លេ។'),
                ('Chaktomuk Sky Residences', E'ចតុមុខស្កាយរេស៊ីដិនកាន់កាប់ដប់បួនជាន់ខាងលើនៃអគារខ្ពស់មួយ នៅមួយប្លុកពីក្រោយមហាវិថីព្រះមុនីវង្ស បើកនៅឆ្នាំ 2021 សម្រាប់អ្នកដែលត្រូវការច្រើនជាងបន្ទប់សណ្ឋាគារ តែតិចជាងកិច្ចសន្យាជួល។ ស្ទូឌីយោ និងអាផាតមិនមួយ និងពីរបន្ទប់គេង មានផ្ទះបាយពេញលេញ ម៉ាស៊ីនបោក-សម្ងួត វ៉ាយហ្វាយលឿន និងតុធ្វើការមានទេសភាព ហើយការសម្អាតបន្ទប់មករាល់ថ្ងៃ ឬរាល់សប្ដាហ៍តាមជម្រើស។\n\nជាន់ទី 28 មានអាងហែលទឹកគ្មានគែមតាមជ្រុងអគារខាងទន្លេ កន្លែងហាត់ប្រាណ សូណា និងបន្ទប់ទទួលភ្ញៀវជាមួយបន្ទប់ប្រជុំ និងម៉ាស៊ីនបោះពុម្ព ដែលដើរតួជាកន្លែងធ្វើការរួមពេលថ្ងៃ។ មាត់ទន្លេ ផ្សារធំថ្មី និងអគារពាណិជ្ជកម្មទាំងអស់នៅក្នុងចម្ងាយដើរដប់ប្រាំនាទី ហើយតុទទួលភ្ញៀវរៀបចំរថយន្តទៅអាកាសយានដ្ឋាន ស៊ីមកាត និងការពន្យារទិដ្ឋាការ។'),
                ('Silk Island River Lodge', E'ឡដ្ជមាត់ទន្លេកោះដាច់គឺជាផ្ទះ និងរោងតម្បាញរបស់គ្រួសារលោករ័ត្ន ដែលតម្បាញសូត្រនៅកោះដាច់អស់ជាច្រើនជំនាន់។ បន្ទប់បីនៅជាន់លើនៃផ្ទះឈើ និងខ្ទមមួយនៅមាត់ទឹកទទួលភ្ញៀវ ហើយសំឡេងកីតម្បាញឮក្រោមផ្ទះតាំងពីព្រលឹម។ ភ្ញៀវអាចអង្គុយលើកីជាមួយអ្នកតម្បាញ ជ្រលក់អំបោះនៅទីធ្លា ឬគ្រាន់តែយកកង់ជិះតាមផ្លូវតូចៗនៃកោះទៅវត្ត និងឆ្នេររដូវប្រាំងនៅចុងខាងជើង។\n\nអាហារចម្អិនដោយគ្រួសារ ហើយញ៉ាំលើផ្ទាំងឈើពីលើទន្លេមេគង្គ។ ភ្នំពេញនៅជិតល្មមសម្រាប់មួយថ្ងៃ ប៉ុន្តែពេលយប់ដូចជាពិភពផ្សេង ពេលដែលសំឡេងតែមួយគឺទន្លេ និងម៉ាស៊ីនភ្លើងនៅវត្តចុងផ្លូវ។'),
                ('Kampot Pepper Estate Bungalows', E'ខ្ទមចម្ការម្រេចកំពតស្ថិតលើចម្ការម្រេចដំណើរការទំហំប្រាំមួយហិកតា ម្ភៃប្រាំនាទីទៅទិសខាងកើតនៃក្រុងកំពត ក្នុងតំបន់ដីក្រហមរវាងបឹងសម្ងាត់ និងភ្នំកែប។ ខ្ទមធ្វើពីឥដ្ឋ និងឈើ ដំបូលក្បឿង ដាក់ឃ្លាតៗគ្នាតាមគែមជួរម្រេច ដូច្នេះទេសភាពពីរានហាលនីមួយៗគឺជញ្ជាំងដើមម្រេចខៀវស្រងាត់លើបង្គោល។ អាងហែលទឹកពីទឹកធម្មជាតិស្ថិតក្រោមដើមស្វាយ ហើយភោជនីយដ្ឋានបើកចំហបម្រើម្ហូបខ្មែរដែលបង្ហាញម្រេចបួនពណ៌របស់ចម្ការ។\n\nភ្ញៀវចូលរួមដើរមើលចម្ការរាល់ព្រឹក និងជួយញែកម្រេចក្នុងរដូវប្រមូលផល។ កង់ និងផែនទីគ្របដណ្ដប់បឹង រូងភ្នំឆ្ងោក និងវាលអំបិល ហើយរថយន្តដឹកជញ្ជូនទៅកំពត និងកែបពីរដងក្នុងមួយថ្ងៃ។'),
                ('Bokor View Guesthouse', E'ទេសភាពបូកគោគឺជាផ្ទះសំណាក់បីជាន់នៅផ្លូវមាត់ទន្លេខាងជើងស្ពានចាស់ គ្រប់គ្រងដោយគ្រួសារកំពតដែលបើកវានៅឆ្នាំ 2010។ បន្ទប់សាមញ្ញ និងថែទាំល្អ មានកម្រាលការ៉ូ ផ្កាឈូកទឹកក្ដៅ និងជម្រើសកង្ហារ ឬម៉ាស៊ីនត្រជាក់ បន្ទប់ខាងមុខមានយ៉រមើលទៅទន្លេ ហើយភ្ញៀវទាំងអស់ប្រើរានហាលលើដំបូលរួមគ្នា ដែលជួរភ្នំបូកគោប្រែជាពណ៌ផ្កាឈូកនៅម៉ោងប្រាំមួយ ហើយគ្រប់គ្នាផឹកស្រាបៀរ។\n\nខាងក្រោមមានហាងកាហ្វេតូចធ្វើស៊ុត នំបុ័ង និងគុយទាវខ្មែរសម្រាប់អាហារពេលព្រឹក។ តុទទួលភ្ញៀវជួលម៉ូតូ និងកង់ កក់ទូកមើលថ្ងៃលិច និងអំពិលអំពែកដែលចេញពីកំពង់ខាងមុខ ហើយរៀបចំតាក់ស៊ីរួមទៅចម្ការម្រេច កែប និងផ្លូវបូកគោ។ ឡានក្រុងទៅភ្នំពេញឈប់នៅពីរផ្លូវពីនេះ។'),
                ('Kep Seaside Villa', E'វីឡាមាត់សមុទ្រកែបគឺជាផ្ទះទំនើបពីរខ្នងលើវាលស្មៅដែលលាតចុះដល់ផ្ទាំងថ្មខាងលិចផ្សារក្ដាម មួយៗមានអាងហែលទឹកវែងបែរមុខទៅឈូងសមុទ្រថៃ និងរូបរាងទាបនៃកោះទន្សាយនៅជើងមេឃ។ វីឡាបីបន្ទប់គេងសមសម្រាប់គ្រួសារមួយ វីឡាប្រាំបន្ទប់គេងពីរជាន់ជាមួយដំបូលបើកចំហ ទទួលគ្រួសារពីរ ឬក្រុមមិត្តភក្ដិ។ ទាំងពីរមានអ្នកថែទាំផ្ទះ អ្នកយាមយប់ និងចុងភៅដែលទៅផ្សារក្ដាមនៅម៉ោងប្រាំពីរ ហើយចម្អិនអ្វីដែលល្អបំផុតថ្ងៃនោះ ពីក្ដាមម្រេចដល់មឹកអាំង។\n\nទូករបស់វីឡាទៅកោះទន្សាយ និងព្រៃកោងកាងតាមការស្នើសុំ ទូកកាយ៉ាក់ និងកង់នៅក្នុងឡានឈប់។ ទៅក្រុងកែបប្រាំនាទីដោយរ៉ឺម៉ក។'),
                ('Otres Beach Resort & Spa', E'រមណីយដ្ឋាន និងស្ប៉ាឆ្នេរអូត្រេសកាន់កាប់ឆ្នេរពីររយម៉ែត្រនៅចុងឆ្ងាយនៃអូត្រេស ត្រង់កន្លែងដែលដើមស្រល់សមុទ្រចូលជិត និងភ្នំរាមចាប់ផ្ដើម។ បើកនៅឆ្នាំ 2013 និងនៅតែរក្សាភាពទាបសាមញ្ញ៖ អគារសួនពីរជាន់ ជួរវីឡាមាត់ឆ្នេរជាមួយអាងតូចឯកជន អាងធំមួយ និងអាងស្ងាត់សម្រាប់មនុស្សពេញវ័យក្រោមដើមឈើ។ ស្ប៉ាធ្វើការក្នុងសាលាបើកចំហ ជាមួយថ្នាំកំដៅរុក្ខជាតិខ្មែរ និងការដុសអំបិលសមុទ្រ ខ្ទមកីឡាទឹកឱ្យខ្ចីទូកកាយ៉ាក់ និងក្ដារបណ្ដែត ហើយភោជនីយដ្ឋានមាត់ឆ្នេរធ្វើអាហារថ្ងៃត្រង់ជាគ្រឿងសមុទ្រ និងអាហារពេលល្ងាចក្រោមពន្លឺទៀនលើខ្សាច់។\n\nបន្ទប់ត្រជាក់ និងសាមញ្ញ ជាមួយឈើ ក្រណាត់ស និងផ្កាឈូកខាងក្រៅ។ កំពង់ផែសាឡាងក្រុងព្រះសីហនុនៅម្ភៃនាទី អាកាសយានដ្ឋានដប់ប្រាំនាទី ហើយរថយន្តរបស់រមណីយដ្ឋានទៅទាំងពីរ។'),
                ('Koh Rong Sunset Bungalows', E'ខ្ទមថ្ងៃលិចកោះរ៉ុងឈរនៅឆ្នេរវែងខាងលិចនៃកោះរ៉ុង ជិះទូកសាមសិបនាទីពីកំពង់ផែកោះតូច ហើយដូចជាពិភពផ្សេងពីបាររបស់វា។ ខ្ទមដប់ប្រាំមួយខ្នងធ្វើពីឈើក្នុងស្រុក ដាក់ក្នុងចំណោមដើមឈើ ខ្លះលើខ្សាច់ ខ្លះលើជម្រាលខាងក្រោយ មានកង្ហារ មុង និងទឹកក្ដៅពីថាមពលព្រះអាទិត្យ អគ្គិសនីមកពីប្រព័ន្ធផ្ទាល់របស់រមណីយដ្ឋាន ហើយដើរម្ភៃបួនម៉ោង។\n\nភោជនីយដ្ឋានស្ថិតនៅលើឆ្នេរ ធ្វើត្រីអាំងពីទូកភូមិ និងសម្លការីខ្មែរ ហើយតុរបស់វាគឺជាកន្លែងដែលត្រូវនៅ ពេលថ្ងៃលិចចូលទៅក្នុងសមុទ្រ។ ទូកកាយ៉ាក់ និងឧបករណ៍មុជទឹកឥតគិតថ្លៃ ដំណើរទូកទៅផ្កាថ្ម និងទៅមើលប្លង់តុងភ្លឺក្រោយងងឹត ហើយបុគ្គលិកស្គាល់ផ្លូវលំនៃកោះ។'),
                ('Sanloem Lazy Beach Hostel', E'ហូស្ទែលឆ្នេរឡេស៊ីស្ថិតនៅចុងផ្លូវលំព្រៃពីឆ្នេរសារ៉ាសែន លើច្រាំងស្ងាត់ខាងលិច ដែលថ្ងៃលិចចូលទៅក្នុងសមុទ្រ។ វាសាមញ្ញដោយចេតនា៖ បន្ទប់រួមដប់ពីរគ្រែ និងប្រាំបីគ្រែក្នុងផ្ទះឈើវែង ខ្ទមស្បូវប្រាំមួយលើខ្សាច់សម្រាប់គូស្នេហ៍ ផ្ទះបាយរួម បារតូចជាមួយស្រាបៀរត្រជាក់ និងធ្នើសៀវភៅប្ដូរគ្នា។ ថាមពលមកពីបន្ទះសូឡា និងម៉ាស៊ីនភ្លើងពេលល្ងាច គ្មានម៉ាស៊ីនត្រជាក់ ហើយវ៉ាយហ្វាយគ្រាន់តែជាពាក្យចចាមអារ៉ាម ដែលនោះហើយជាចំណុចសំខាន់។\n\nពេលថ្ងៃសម្រាប់ឆ្នេរ និងមុជទឹកមើលផ្កាថ្មនៅផ្ទាំងថ្ម ពេលយប់សម្រាប់អង្រឹង និងទឹកភ្លឺចែងចាំង។ ទូកវែងរបស់ហូស្ទែលទៅទទួលសាឡាងនៅឆ្នេរសារ៉ាសែន សម្រាប់អ្នកដែលមិនចង់ដើរផ្លូវលំ។'),
                ('Battambang Colonial House', E'ផ្ទះសម័យអាណានិគមបាត់ដំបងគឺជាផ្ទះល្វែងកែងផ្លូវពីទសវត្សរ៍ 1920 នៅផ្លូវមាត់ស្ទឹង ជួសជុលឡើងវិញអស់ពីរឆ្នាំដោយគ្រួសារដែលនៅតែគ្រប់គ្រងវា។ បន្ទប់ប្រាំបួនរក្សាឆ្អឹងខ្នងនៃអគារ៖ ពិដានកម្ពស់បួនម៉ែត្រ ការ៉ូក្បាច់ ទ្វារបង្អួចឈើធ្នង់ និងយ៉រវែងតាមជាន់ទីមួយពីលើផ្លូវ។ ជាន់ផ្ទាល់ដីជាហាងកាហ្វេបើកទៅទីធ្លា ដែលកាហ្វេមកពីអ្នកលីងកាហ្វេបាត់ដំបង។\n\nម្ចាស់ស្គាល់តំបន់សិល្បៈច្បាស់ ហើយរក្សាផែនទីគូរដោយដៃនៃវិចិត្រសាល ស្ទូឌីយោ និងកាលវិភាគសៀកនៅតុទទួលភ្ញៀវ។ កង់ឥតគិតថ្លៃ ហើយការជិះមួយថ្ងៃទៅដល់រថភ្លើងឫស្សី ប្រាសាទបាណន់ និងល្អាងប្រចៀវភ្នំសំពៅ។ ទូកទៅសៀមរាបចេញពីកំពង់ពីរប្លុកទៅទិសខាងជើង។'),
                ('Sen Monorom Hill Lodge', E'ឡដ្ជភ្នំសែនមនោរម្យលាតសន្ធឹងលើជម្រាលភ្នំស្មៅ មួយគីឡូម៉ែត្រពីលើក្រុង ត្រង់កន្លែងដែលខ្ពង់រាបមណ្ឌលគិរីរលកបៃតងទៅដល់ជើងមេឃ។ ខ្ទមគ្របដោយឈើស្រល់ក្នុងស្រុក ដំបូលស័ង្កសីដែលឮសូរពេលភ្លៀង មួយៗមានរានហាលបែរមុខទៅជ្រលង ភួយក្រាស់សម្រាប់យប់ត្រជាក់ និងផ្កាឈូកទឹកក្ដៅដែលសំខាន់នៅកម្ពស់នេះ។ ភោជនីយដ្ឋានមានជើងក្រានភ្លើងដែលដុតពីខែធ្នូដល់កុម្ភៈ និងមុខម្ហូបផ្អែកលើរូបមន្តព្នង កាហ្វេខ្ពង់រាប និងបន្លែពីសួនឡដ្ជ។\n\nមគ្គុទ្ទេសក៍ពីភូមិព្នងក្រោមភ្នំនាំដើរទៅទឹកធ្លាក់ និងកាត់ព្រៃ ហើយរថយន្តរបស់ឡដ្ជទៅប៊ូស្រា មណ្ឌលអភិរក្សដំរី និងចម្ការកាហ្វេ។'),
                ('Kratie Mekong View Hotel', E'សណ្ឋាគារទេសភាពមេគង្គក្រចេះជាសណ្ឋាគារបួនជាន់នៅផ្លូវមាត់ទន្លេ បែរមុខទៅកំពង់សាឡាងទៅកោះត្រុង និងថ្ងៃលិចវែងលើកោះ។ ដំណើរការតាំងពីឆ្នាំ 2008 ហើយថ្មីៗនេះបានធ្វើបន្ទប់ទឹក និងវ៉ាយហ្វាយឡើងវិញ ប៉ុន្តែលក្ខណៈមិនផ្លាស់ប្ដូរ៖ បន្ទប់ការ៉ូ គ្រែរឹង ម៉ាស៊ីនត្រជាក់ និងបុគ្គលិកដែលកក់អ្វីក៏បានក្នុងខេត្តក្នុងតម្លៃដែលអ្នកស្រុកបង់។ ជាន់លើមើលទៅទន្លេមេគង្គ ជាន់ក្រោមមើលទៅផ្សារខាងក្រោយ។\n\nអាហារពេលព្រឹកបម្រើលើរានហាលខាងមុខ ដោយមានទូកឆ្លងកាត់លើទន្លេ។ តុទទួលភ្ញៀវរៀបចំរ៉ឺម៉ក និងម៉ូតូទៅអន្លង់ផ្សោតកំពី កង់ និងសាឡាងទៅកោះត្រុង និងសំបុត្រឡានក្រុង និងឡានតូចទៅភ្នំពេញ និងស្ទឹងត្រែង។'),
                ('Banlung Lake Guesthouse', E'ផ្ទះសំណាក់បឹងបានលុងគឺជាក្រុមខ្ទមឈើ និងអគារពីរជាន់ក្នុងសួនខ្នុរ និងស្វាយចន្ទីនៅខាងកើតបានលុង ជិះម៉ូតូដប់នាទីពីបឹងភ្នំភ្លើង និងប្រាំនាទីពីផ្សារ។ ម្ចាស់ជាជនជាតិទំពួន ហើយផ្ទះសំណាក់នេះបានក្លាយជាផ្លូវងាយស្រួលចូលទៅរតនគិរី៖ ពួកគាត់ជួលម៉ូតូជាមួយផែនទីទឹកធ្លាក់ រ៉ែត្បូង និងភូមិ រៀបចំទូកលើទន្លេសេសាន និងកក់ដំណើរដើរព្រៃចូលវីរជ័យតាមការិយាល័យឧទ្យានជាមួយមគ្គុទ្ទេសក៍ដែលគាត់ស្គាល់។\n\nបន្ទប់សាមញ្ញ និងស្អាត មានកង្ហារ ឬម៉ាស៊ីនត្រជាក់ និងផ្កាឈូកទឹកក្ដៅ ហើយខ្ទមមានអង្រឹងលើរានហាល។ អាហារពេលព្រឹកមានស៊ុត ផ្លែឈើ នំបុ័ង និងកាហ្វេរតនគិរីខ្លាំងក្រោមដើមឈើ។ ពេលល្ងាចក្នុងសួនស្ងាត់ លើកលែងតែសំឡេងជីងចក់។'),
                ('Tatai River Ecolodge', E'អេកូឡដ្ជទន្លេតាតៃស្ថិតនៅផតទន្លេតាតៃ ត្រង់កន្លែងដែលព្រៃកោងកាងប្ដូរទៅជាព្រៃភ្លៀង ម្ភៃនាទីដោយទូកពីស្ពានលើផ្លូវជាតិលេខ 48 និងម្ភៃនាទីទៀតពីទឹកធ្លាក់។ ខ្ទមប្រាំមួយអណ្ដែតលើប៉ុងតុងតាមច្រាំង និងបួនឈរលើជម្រាលខាងក្រោយ ទាំងអស់ធ្វើពីឈើ និងស្បូវ ជាមួយថាមពលព្រះអាទិត្យ បង្គន់កំប៉ុស និងរានហាលធំទូលាយពីលើទឹក។\n\nពេលថ្ងៃគឺជិះទូកកាយ៉ាក់ ហែលទឹកពីរានហាល ដើរកាត់ព្រៃជាមួយអ្នកយាមព្រៃពីភូមិ និងទូកទៅទឹកធ្លាក់។ ភោជនីយដ្ឋានស្ថិតលើផ្ទាំងអណ្ដែត បំភ្លឺដោយទៀន និងប្រើអ្វីដែលអ្នកនេសាទ និងកសិករភូមិនាំមក។ ឡដ្ជជួលបុគ្គលិកភាគច្រើនពីភូមិតាតៃ ហើយបង់ប្រាក់ចូលមូលនិធិព្រៃឈើរបស់ភូមិ។')
              ) AS v (k, km)
