                ('kampong-cham-mekong-grill', E'អាំងមេគង្គកំពង់ចាមលាតតាមមាត់ទន្លេក្រោមដើមឈើធំខាងត្បូងស្ពាន ផ្ទះបាយក្នុងផ្ទះល្វែង និងតុសែសិបនៅខាងក្រៅបែរមុខទៅទឹក។ ត្រីមកពីទូកនៅកំពង់ក្បែរនោះ៖ ត្រីរ៉ស់ ត្រីប្រា និងត្រីរ៉ស់យក្ស លាបអំបិល រមៀត និងស្លឹកគ្រៃ ហើយអាំងទាំងមូលលើធ្យូងរហូតដល់ស្បែកពោង បម្រើជាមួយចានជីរ បាយ និងទឹកជ្រលក់អំពិល។ ក្បែរនោះមានឆ្អឹងជំនីរជ្រូកស្លស្ករត្នោត សម្លម្ជូរត្រីមេគង្គ មាន់អាំង និងត្រកួនឆា។\n\nវាចិញ្ចឹមក្រុងតាំងពីឆ្នាំ 2009 ហើយពេញពេលល្ងាច ពេលភ្លើងបើកតាមស្ពានឫស្សីទៅកោះប៉ែន។'),
                ('takeo-lake-fish-market', E'ផ្សារមាត់បឹងតាកែវធ្វើការតាំងពីមុនព្រលឹម ពេលទូកចូលមកឆ្លងវាលទំនាបពីអង្គរបុរីជាមួយត្រីចាប់បានពេលយប់៖ ត្រីរ៉ស់ ត្រីអណ្ដែង ត្រីក្រាញ់ អន្ទង់ និងបង្កងទឹកសាបយក្សដែលខេត្តល្បី។ ខាងក្រោយត្រី តូបប្រហែលសែសិបលក់បន្លែ និងជីរនៃវាលលិចទឹក ហើយជួរអ្នកលក់ប្រហុកដួសប្រហុកពីក្អមដី។ ជុំវិញគែម អ្នកចម្អិនអាំងត្រីលើឫស្សីលើធ្យូង ស្ងោរឆ្នាំងសម្ល និងធ្វើនំបញ្ចុកសម្រាប់អ្នកទិញ។\n\nពីរដុល្លារបានត្រីអាំងមួយជាមួយបាយ ញ៉ាំលើជើងម៉ាក្បែរទឹក។ ផ្សារល្អបំផុតរវាងម៉ោងប្រាំ និងប្រាំបី ហើយស្ងប់ស្ងាត់ដល់ថ្ងៃត្រង់។')
