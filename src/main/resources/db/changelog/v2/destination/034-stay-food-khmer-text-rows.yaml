                ('pub-street-khmer-kitchen', E'ផ្ទះបាយខ្មែរផាប់ស្ទ្រីតបើកនៅឆ្នាំ 2013 ដើម្បីចិញ្ចឹមហ្វូងភ្ញៀវប្រាសាទជាមួយអ្វីដែលល្អជាងបាយឆាធម្មតារបស់ផ្លូវនេះ។ មុខម្ហូបគឺម្ហូបខ្មែរបុរាណចម្អិនដោយយកចិត្តទុកដាក់៖ អាម៉ុកត្រីចំហុយក្នុងស្លឹកចេករហូតទើបរឹង ឡុកឡាក់សាច់គោជាមួយទឹកជ្រលក់ក្រូចឆ្មាម្រេច មឹកឆាម្រេចខ្ចីកំពត សម្លកកូរ និងសម្រាប់អ្នកក្លាហាន សាច់គោឆាអង្ក្រង។ ចានធំ ហើយហឹរពិតមែន ប៉ុន្តែអាចកែបាន។\n\nជាន់ផ្ទាល់ដីអ៊ូអរ និងលឿន យ៉រជាន់ទីមួយគឺកន្លែងអង្គុយជាមួយស្រាបៀរអង្គរមួយក្អម ហើយមើលផាប់ស្ទ្រីតចាប់ផ្ដើមពេញ។ មុខម្ហូបភាសាអង់គ្លេស ខ្មែរ និងចិនមានរូបភាព ធ្វើឱ្យការកុម្ម៉ង់ងាយស្រួល។'),
                ('angkor-morning-noodles', E'អ្នកស្រីសុផលរុញរទេះគុយទាវរបស់គាត់មកជ្រុងផ្លូវដដែលនៅផ្លូវទៅអង្គរតាំងពីឆ្នាំ 2009 ហើយដល់ម៉ោងប្រាំកន្លះ ជើងម៉ាប្លាស្ទិកពេញដោយអ្នកបើករ៉ឺម៉កដែលរង់ចាំភ្ញៀវមើលថ្ងៃរះ។ មុខម្ហូបគឺគុយទាវ៖ មីស្រួយក្នុងទឹកស៊ុបឆ្អឹងជ្រូកថ្លាស្ងោរពេញមួយយប់ ដាក់សាច់ជ្រូកចិត បង្គាពីរបី សាច់ជ្រូកចិញ្ច្រាំ សណ្ដែកបណ្ដុះ ខ្ទឹមបំពង និងក្រូចឆ្មាច្របាច់ ជាមួយម្ទេស ម្ទេសជ្រក់ និងទឹកត្រីលើតុសម្រាប់ថែមដោយខ្លួនឯង។ ក៏មានគុយទាវគោក ដោយទឹកស៊ុបដាក់ដោយឡែក។\n\nលក់អស់មុនម៉ោងដប់។ ឈប់នៅតាមផ្លូវទៅប្រាសាទ ហើយញ៉ាំអ្វីដែលអ្នកបើកបរញ៉ាំ។'),
                ('kandal-village-cafe', E'ហាងកាហ្វេកណ្ដាលវីលេជជាហាងដំបូងៗដែលបើកនៅច្រកហាងប៊ូទិក និងវិចិត្រសាលខាងជើងផ្សារចាស់ ក្នុងឆ្នាំ 2015 ហើយនៅតែជាស្តង់ដារសម្រាប់អាហារព្រឹកបន្តដល់ថ្ងៃត្រង់នៅសៀមរាប។ កាហ្វេលីងនៅភ្នំពេញពីគ្រាប់មណ្ឌលគិរី និងធ្វើដោយម៉ាស៊ីនត្រឹមត្រូវ មានកូលប្រ៊ូ និងទឹកដោះគោអូតសម្រាប់អ្នកដែលចង់បាន។ ម្ហូបមានពីស៊ុតលើនំបុ័ងសាវដូ និងហ្គ្រាណូឡា ដល់អាហារពេលព្រឹកខ្មែរបាយសាច់ជ្រូក និងស៊ុបល្ពៅដូងដ៏ឆ្ងាញ់។\n\nបន្ទប់ជាការ៉ូស និងឈើចាស់ ជាមួយទីធ្លាមានម្លប់នៅខាងក្រោយ វ៉ាយហ្វាយលឿន ហើយកុំព្យូទ័រយួរដៃអាចប្រើបានរហូតដល់ពេលមមាញឹកថ្ងៃត្រង់។'),
                ('tonle-sap-fish-house', E'ផ្ទះត្រីទន្លេសាបជាភោជនីយដ្ឋានធំបើកចំហនៅផ្លូវទៅទិសខាងត្បូងឆ្ពោះទៅជុងឃ្នាស គ្រប់គ្រងដោយគ្រួសារដែលឡើងពីបឹងមួយជំនាន់មុន ហើយនៅតែទិញពីទូករាល់ព្រឹក។ អាម៉ុកត្រីនៅទីនេះគឺពិតប្រាកដ ក្រាស់ដោយគ្រឿងស្រស់ និងខ្ទិះដូង ចំហុយក្នុងស្លឹកចេក ជាមួយវាមានសម្លម្ជូរត្រីជាមួយអំពិល និងទងឈូក ត្រីរ៉ស់ទាំងមូលអាំងលើធ្យូងជាមួយទឹកជ្រលក់ក្រូចឆ្មាអំបិល និងត្រីចៀនស្រួយជាមួយញាំស្វាយខ្ចី។\n\nដំបូលស័ង្កសី និងកង្ហារពិដានរក្សាភាពត្រជាក់គ្រប់គ្រាន់ ហើយតម្លៃថោក។ ទៅជាមួយមនុស្សច្រើននាក់ ហើយកុម្ម៉ង់សម្រាប់តុទាំងមូល។'),
                ('old-market-smoothie-bar', E'ហាងទឹកផ្លែឈើផ្សារចាស់ជាតុលក់ទទឹងបីម៉ែត្រនៅជ្រុងផ្លូវបែរមុខទៅផ្សារចាស់ មានជញ្ជាំងផ្លែឈើគរនៅខាងក្រោយ និងជួរម៉ាស៊ីនកិនដែលកម្រឈប់។ អ្វីៗទាំងអស់ធ្វើតាមការកុម្ម៉ង់ពីអ្វីដែលមកពីផ្សារព្រឹកនោះ៖ ស្វាយ ផ្លែស្រកានាគ ម្នាស់ ទៀបបារាំង និងចេក កិនជាមួយទឹកកក និងស្ករត្នោតបន្តិច ឬជាមួយទឹកដូង ហើយគ្មានអ្វីផ្សេងទៀត។ ដូងខ្ចីកាប់បើកដោយកាំបិតពេលអ្នករង់ចាំ ហើយជើងម៉ាពីរបីឱ្យអ្នកផឹកនៅនឹងកន្លែង។\n\nគ្រប់គ្រងដោយបងប្អូនស្រីពីរនាក់ដដែលតាំងពីឆ្នាំ 2014 ហើយជាកន្លែងឈប់ដ៏សមហេតុផលរវាងផ្សារ និងផ្សាររាត្រី។'),
                ('preah-dak-num-banh-chok', E'ព្រះដាក់ ភូមិនៅផ្លូវទៅបន្ទាយស្រី ល្បីដោយនំបញ្ចុកអស់ជាច្រើនជំនាន់ ហើយតូបរបស់យាយផាន ដែលកូនស្រីគាត់គ្រប់គ្រងតាំងពីឆ្នាំ 2010 គឺជាតូបដែលអ្នកបើកបរចូលឈប់។ មីច្របាច់ស្រស់រាល់ព្រលឹមពីអង្ករផ្អាប់ ទន់ និងជូរបន្តិច ដួសដាក់ទឹកសម្លបៃតងស្ដើងពីត្រី ស្លឹកគ្រៃ រមៀត និងរំដេង ឬទឹកក្រហមជាមួយដូង និងម្ទេសសម្រាប់អ្នកដែលសុំ។ ពីលើដាក់អ្វីដែលស្រស់៖ ត្រយូងចេក ត្រសក់ ទងព្រលិត សណ្ដែកកួរ ជីរអង្កាម និងជីរនាងវង។\n\nមួយចានតម្លៃមួយដុល្លារ។ ក៏លក់នំក្រូច និងបង្អែមបាយដំណើបសម្រាប់យកទៅប្រាសាទដែរ។'),
                ('riverside-grill-house', E'ផ្ទះអាំងមាត់ទន្លេគឺជាប្រពៃណីអាំងសាច់របស់ភ្នំពេញធ្វើក្នុងទ្រង់ទ្រាយធំ៖ សាលមួយរយកៅអីបើកទៅផ្លូវ តុនីមួយៗមានចង្ក្រានធ្យូង និងឆ្នាំងអាំងរាងដូមដែលអាំងសាច់ពីលើ និងស្ងោរទឹកស៊ុបក្នុងស្នាមជុំវិញ។ អ្នកកុម្ម៉ង់តាមចាន៖ សាច់គោប្រឡាក់ស្លឹកគ្រៃ សាច់ជ្រូកបីជាន់ មឹក បង្គា ផ្សិត និងត្រកួនសម្រាប់ស៊ុប ជាមួយទឹកជ្រលក់ក្រូចឆ្មា ម្រេច និងប្រហុកនៅក្បែរ។\n\nស្រាបៀរអង្គរមកជាក្អមជាមួយទឹកកក តន្ត្រីឮខ្លាំង និងបែបក្នុងស្រុក ហើយដល់ម៉ោងប្រាំបួន គ្រប់តុពេញដោយគ្រួសារ និងក្រុមការិយាល័យអបអរអ្វីមួយ។ តម្លៃថោក ផ្សែងជាផ្នែកមួយនៃកិច្ចព្រមព្រៀង ហើយអ្នកនឹងមានក្លិនវារហូតដល់ព្រឹក។'),
                ('bassac-lane-tapas', E'តាប៉ាសច្រកបាសាក់កាន់កាប់ផ្ទះល្វែងមួយក្នុងច្រកបារខាងក្រោយផ្លូវ 308 នៅឆ្នាំ 2019 ហើយផ្ដល់ឱ្យវានូវផ្ទះបាយដែលសមនឹងអង្គុយ។ ចានតូច និងសម្រាប់ចែកគ្នា៖ មឹកម្រេចកំពត សាច់ជ្រូកបីជាន់ស្លស្ករត្នោត ប្រហុកខ្ទិះជាមួយបន្លែស្រស់ និងបង្គាទន្លេអាំងជាមួយស្វាយខ្ចី។ បារចាក់ស្រាធម្មជាតិតាមកែវ និងស្រាក្រឡុកផ្អែកលើស្រាសខ្មែរ ម្រេចកំពត និងអំពិល ជាមួយម៉ោងសប្បាយពីប្រាំដល់ប្រាំពីរ។\n\nខាងក្នុងមានជើងម៉ាម្ភៃតាមតុវែង និងផ្ទះបាយបើកចំហ ខាងក្រោយមានទីធ្លាក្រោមដើមអំពិល។ កក់សម្រាប់ថ្ងៃសុក្រ និងសៅរ៍ ពេលដែលច្រកមមាញឹកបំផុត ហើយផ្ទះបាយដើរដល់ម៉ោងមួយ។'),
                ('orussey-market-breakfast', E'ផ្សារអូរឫស្សី ពីរបីប្លុកខាងលិចផ្សារធំថ្មី ជាផ្សារលក់ដុំរបស់រាជធានីសម្រាប់អ្វីៗទាំងអស់ពីត្រីងៀតដល់ស្បែកជើងសិស្ស ហើយសាលអាហារជាន់ផ្ទាល់ដីរបស់វាជាកន្លែងដែលអ្នកធ្វើការផ្សារ និងពាក់កណ្ដាលសង្កាត់ញ៉ាំអាហារពេលព្រឹក។ តូបប្រហែលម្ភៃប្រើតុដែកវែងរួមគ្នា។ អ្វីដែលត្រូវកុម្ម៉ង់គឺបាយសាច់ជ្រូក៖ សាច់ជ្រូកចិតស្ដើងប្រឡាក់ខ្ទិះដូង និងខ្ទឹម អាំងលើធ្យូងមុនព្រលឹម ហើយដាក់លើបាយអង្ករបែក ជាមួយត្រសក់ និងឆៃថាវជ្រក់ និងស៊ុបថ្លាមួយចាន។\n\nគុយទាវ បបរ និងកាហ្វេទឹកកកនៅតូបក្បែរនោះ។ ចប់មុនម៉ោងដប់មួយ។ ទៅឱ្យឆាប់ ចង្អុល ហើយអង្គុយកន្លែងណាដែលទំនេរ។'),
