# A bakery is a café.
#
# Both sell over a counter, and the café's form already asks a place to pick
# what it makes — iced Khmer coffee, espresso, a latte — so bread, pastries and
# cakes are three more groups on that same list rather than a kind of their
# own (FoodSpecialties.BY_KIND.CAFE). FoodType loses BAKERY, so the rows that
# hold it move here; the specialty slugs are unchanged, so a bakery keeps every
# bake it had chosen and simply reads as a café that bakes.
databaseChangeLog:
  - changeSet:
      id: v2-destination-bakery-into-cafe
      author: ams-travel-v2
      changes:
        - sql: {sql: "UPDATE destination.destination_foods SET type = 'CAFE' WHERE type = 'BAKERY'"}
      rollback:
        # Which cafés used to be bakeries is not recorded; the ones that say
        # they bake are the closest honest answer.
        - sql:
            sql: |
              UPDATE destination.destination_foods SET type = 'BAKERY'
              WHERE type = 'CAFE'
                AND (CAST(specialties AS VARCHAR) LIKE '%bread%'
                  OR CAST(specialties AS VARCHAR) LIKE '%baguettes%'
                  OR CAST(specialties AS VARCHAR) LIKE '%pastries%'
                  OR CAST(specialties AS VARCHAR) LIKE '%cakes%');
