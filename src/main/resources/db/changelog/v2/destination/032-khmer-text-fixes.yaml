# Better Khmer for attractions whose first translation read too literally.
# Swaps only text still as first written, so an editor's own fix is kept.
databaseChangeLog:
  - changeSet:
      id: v2-destination-khmer-text-fixes
      author: ams-travel-v2
      dbms: postgresql
      changes:
        - sql:
            splitStatements: true
            sql: |
              UPDATE destination.destinations d SET name_km = v.next FROM (VALUES
                ('battambang-art-quarter', E'សង្កាត់សិល្បៈបាត់ដំបង', E'តំបន់សិល្បៈបាត់ដំបង'),
                ('phnom-penh-coffee-quarter', E'សង្កាត់កាហ្វេភ្នំពេញ', E'តំបន់ហាងកាហ្វេភ្នំពេញ'),
                ('angkorian-royal-road', E'ផ្លូវហ្លួងសម័យអង្គរ', E'ផ្លូវរាជសម័យអង្គរ')
              ) AS v (slug, was, next)
              WHERE v.slug = d.slug AND d.name_km = v.was;

              UPDATE destination.destinations d SET description_km = v.next FROM (VALUES
                ('kampot-riverfront', E'ជួរផ្ទះល្វែងដែលបានជួសជុលឡើងវិញ បែរមុខទៅទន្លេដែលហូរយឺតៗ និងខ្នងភ្នំបូកគោ។\n\nជិះទូកមើលថ្ងៃលិច — ភ្នំនឹងធ្វើផ្នែកដែលនៅសល់។', E'ជួរផ្ទះល្វែងដែលបានជួសជុលឡើងវិញ បែរមុខទៅទន្លេដែលហូរយឺតៗ និងខ្នងភ្នំបូកគោ។\n\nជិះទូកមើលថ្ងៃលិច ហើយរីករាយនឹងទេសភាពភ្នំបូកគោពីលើទន្លេ។'),
                ('chi-phat', E'ភូមិមួយនៅជួរភ្នំក្រវាញ ដែលបានងាកចេញពីការកាប់ឈើ និងការបរបាញ់សត្វខុសច្បាប់ មកដំណើរការអេកូទេសចរណ៍ផ្ទាល់ខ្លួន។\n\nកក់តាមរយៈការិយាល័យសហគមន៍ក្នុងភូមិ។ នោះហើយជាគំរូទាំងមូល។', E'ភូមិមួយនៅជួរភ្នំក្រវាញ ដែលបានងាកចេញពីការកាប់ឈើ និងការបរបាញ់សត្វខុសច្បាប់ មកដំណើរការអេកូទេសចរណ៍ផ្ទាល់ខ្លួន។\n\nកក់តាមរយៈការិយាល័យសហគមន៍ក្នុងភូមិ ព្រោះសហគមន៍ជាអ្នករៀបចំ និងទទួលផលពីទេសចរណ៍ទាំងអស់។'),
                ('koh-ker', E'រាជធានីតែម្ភៃឆ្នាំប៉ុណ្ណោះ និងប្រាសាទពីរ៉ាមីតប្រាំពីរជាន់ជាភស្តុតាង។\n\nការសាកល្បងដ៏ខ្លីរបស់ចក្រភពមួយ ស្ថិតនៅតែឯងក្នុងព្រៃ។', E'ធ្លាប់ជារាជធានីត្រឹមតែម្ភៃឆ្នាំ ហើយប្រាសាទកំពូលភ្នំប្រាំពីរជាន់ (ប្រាសាទធំ) នៅតែជាសក្ខីភាព។\n\nរាជធានីអាយុកាលខ្លីរបស់ចក្រភពខ្មែរ ដែលស្ថិតនៅស្ងាត់ៗក្នុងព្រៃ។'),
                ('battambang-art-quarter', E'រាជធានីសិល្បៈនៃកម្ពុជា — វិចិត្រសាល សាលាសៀក និងស្ទូឌីយោសិប្បកម្ម ក្នុងផ្ទះល្វែងមាត់ស្ទឹង។\n\nផ្លូវផ្ទះល្វែងដែលរក្សាបានល្អបំផុតក្នុងប្រទេស ដោយមានវិចិត្រសាលនៅពីក្រោយទ្វាររបាំង។', E'មជ្ឈមណ្ឌលសិល្បៈនៃកម្ពុជា — វិចិត្រសាល សាលាសៀក និងស្ទូឌីយោសិប្បកម្ម ក្នុងផ្ទះល្វែងមាត់ស្ទឹង។\n\nផ្លូវផ្ទះល្វែងដែលរក្សាបានល្អបំផុតក្នុងប្រទេស ដោយមានវិចិត្រសាលនៅពីក្រោយទ្វាររបាំង។'),
                ('koh-rong', E'ឆ្នេរខ្សាច់សវែងៗ ទឹកសមុទ្រភ្លឺចែងចាំងពេលយប់ និងផ្លូវកៅស៊ូតិចតួចបំផុត។\n\nហែលទឹកក្រោយពេលងងឹតនៅឆ្នេរខាងកើត — ប្លង់តុងភ្លឺចែងចាំង។', E'ឆ្នេរខ្សាច់សវែងៗ ទឹកសមុទ្រភ្លឺចែងចាំងពេលយប់ និងផ្លូវកៅស៊ូតិចតួចបំផុត។\n\nហែលទឹកពេលយប់នៅឆ្នេរខាងកើត — ទឹកសមុទ្រនឹងភ្លឺចែងចាំងជុំវិញខ្លួនអ្នក។'),
                ('kampot-pepper-farm', E'វល្លិម្រេចដែលមានការការពារប្រភពដើម បេះដោយដៃ និងញែកតាមពណ៌។\n\nភ្លក់ម្រេចខ្ចីដែលទើបបេះពីដើមស្រស់ៗ យ៉ាងហោចណាស់ម្ដង។', E'ម្រេចកំពតដែលមានសញ្ញាសម្គាល់ភូមិសាស្ត្រ បេះដោយដៃ និងញែកតាមពណ៌។\n\nភ្លក់ម្រេចខ្ចីដែលទើបបេះពីដើមស្រស់ៗ យ៉ាងហោចណាស់ម្ដង។'),
                ('angkorian-royal-road', E'ផ្លូវហ្លួងប្រវែង ២២៥ គីឡូម៉ែត្រ ពីអង្គរឆ្ពោះទៅទិសខាងកើតរហូតដល់បាកាន ជាមួយស្ពាន ផ្ទះភ្លើង និងវិហារអារោគ្យសាលា។\n\nចក្រភពមួយងាយយល់បំផុតតាមរយៈផ្លូវថ្នល់របស់វា។', E'ផ្លូវរាជប្រវែង ២២៥ គីឡូម៉ែត្រ ពីអង្គរឆ្ពោះទៅទិសខាងកើតរហូតដល់បាកាន ជាមួយស្ពាន ផ្ទះភ្លើង និងវិហារអារោគ្យសាលា។\n\nចក្រភពមួយងាយយល់បំផុតតាមរយៈផ្លូវថ្នល់របស់វា។'),
                ('preah-vihear-temple', E'ប្រាសាទដែលលាតសន្ធឹងតាមអ័ក្សប្រវែង ៨០០ ម៉ែត្រ នៅលើគែមច្រាំងថ្មនៃជួរភ្នំដងរែក។\n\nផ្លូវឡើងទៅដល់ គឺជាចំណុចសំខាន់ — ឡើងយឺតៗ។', E'ប្រាសាទដែលលាតសន្ធឹងតាមអ័ក្សប្រវែង ៨០០ ម៉ែត្រ នៅលើគែមច្រាំងថ្មនៃជួរភ្នំដងរែក។\n\nដំណើរឡើងទៅដល់ប្រាសាទ គឺជាបទពិសោធន៍ដ៏សំខាន់ — សូមឡើងយឺតៗ ហើយរីករាយនឹងទេសភាព។'),
                ('song-saa-private-island', E'កោះតូចពីរភ្ជាប់គ្នាដោយស្ពានថ្មើរជើង និងតំបន់អភិរក្សសមុទ្រដែលត្រូវបានការពារ។\n\nភាពប្រណីតដែលផ្ដល់ថវិកាដល់ការអភិរក្ស — ថ្លៃការពារថ្មប៉ប្រះទឹក គឺជាចំណុចសំខាន់។', E'កោះតូចពីរភ្ជាប់គ្នាដោយស្ពានថ្មើរជើង និងតំបន់អភិរក្សសមុទ្រដែលត្រូវបានការពារ។\n\nភាពប្រណីតដែលជួយផ្ដល់ថវិកាដល់ការអភិរក្ស — ថ្លៃការពារថ្មប៉ប្រះទឹកជួយថែរក្សាសមុទ្រជុំវិញកោះ។'),
                ('mekong-discovery-trail', E'ផ្លូវជិះកង់តាមមាត់ទន្លេ កាត់តាមចម្ការកៅស៊ូ និងភូមិនៅលើកោះ។\n\nជិះជាដំណាក់ៗ — ការជិះសាឡាងគឺជាពាក់កណ្ដាលនៃភាពរីករាយ។', E'ផ្លូវជិះកង់តាមមាត់ទន្លេ កាត់តាមចម្ការកៅស៊ូ និងភូមិនៅលើកោះ។\n\nជិះជាដំណាក់ៗ — ការឆ្លងសាឡាងក៏ជាផ្នែកមួយនៃភាពសប្បាយដែរ។'),
                ('tatai-waterfall', E'ទឹកធ្លាក់ធំទូលាយលើស្ទឹងតាតៃ នៅគែមភាគខាងត្បូងនៃជួរភ្នំក្រវាញ។\n\nជិះទូកពីស្ពាន។ ការធ្វើដំណើរតាមទន្លេ គឺជាពាក់កណ្ដាលនៃភាពរីករាយ។', E'ទឹកធ្លាក់ធំទូលាយលើស្ទឹងតាតៃ នៅគែមភាគខាងត្បូងនៃជួរភ្នំក្រវាញ។\n\nជិះទូកពីស្ពាន។ ដំណើរតាមទន្លេក៏ជាបទពិសោធន៍ដ៏ស្រស់ស្អាតមួយដែរ។'),
                ('battambang-bamboo-train', E'កម្រាលឫស្សីដាក់លើកង់រថភ្លើង រត់តាមផ្លូវដែកតែមួយដែលកោងរៀច។\n\nមធ្យោបាយធ្វើដំណើរច្នៃប្រឌិត ដែលនៅរស់រានយូរជាងផ្លូវដែកដែលខ្លួនខ្ចីប្រើ។', E'កម្រាលឫស្សីដាក់លើកង់រថភ្លើង រត់តាមផ្លូវដែកតែមួយដែលកោងរៀច។\n\nមធ្យោបាយធ្វើដំណើរដែលអ្នកស្រុកច្នៃប្រឌិតខ្លួនឯង ហើយនៅតែដំណើរការ ទោះបីរថភ្លើងពិតលែងរត់ក៏ដោយ។'),
                ('elephant-valley-project', E'ជម្រកមួយដែលដំរីធ្វើការចូលនិវត្តន៍ ត្រូវបានគេនាំដើរ មិនមែនជិះទេ។\n\nមើល មិនមែនជិះ — ការទស្សនាធ្វើឡើងតាមចិត្តរបស់ដំរី។', E'ជម្រកមួយដែលដំរីធ្វើការចូលនិវត្តន៍ ត្រូវបានគេនាំដើរ មិនមែនជិះទេ។\n\nមើល មិនមែនជិះ — ការទស្សនាគោរពតាមសេរីភាព និងសុខុមាលភាពរបស់ដំរី។'),
                ('num-banh-chok-markets', E'តូបពេលព្រឹកដែលអាហារពេលព្រឹកជាតិរបស់កម្ពុជា ត្រូវបានគេបញ្ចុក ស្ងោរ និងចាក់សម្លតាមការកុម្ម៉ង់។\n\nអស់មុនម៉ោងប្រាំបួន។ បន្លែស្រស់ដាក់ពីលើ គឺត្រូវតែមាន។', E'តូបពេលព្រឹកដែលលក់នំបញ្ចុក ជាអាហារពេលព្រឹកប្រចាំជាតិរបស់កម្ពុជា ដែលគេធ្វើស្រស់ៗ ហើយចាក់សម្លតាមការកុម្ម៉ង់។\n\nអស់មុនម៉ោងប្រាំបួន។ បន្លែស្រស់ដាក់ពីលើ គឺត្រូវតែមាន។'),
                ('ta-prohm', E'អារាមមួយដែលត្រូវបានទុកឱ្យឫសដើមឈើធំៗរុំព័ទ្ធ ដោយចេតនាមិនជួសជុល។\n\nប្រាសាទតែមួយគត់ដែលព្រៃឈើត្រូវបានអនុញ្ញាតឱ្យរក្សាការគ្រប់គ្រងរបស់វា។', E'អារាមមួយដែលត្រូវបានទុកឱ្យឫសដើមឈើធំៗរុំព័ទ្ធ ដោយចេតនាមិនជួសជុល។\n\nប្រាសាទតែមួយគត់ដែលគេទុកឱ្យដើមឈើ និងព្រៃនៅជាប់នឹងប្រាសាទដដែល។'),
                ('royal-palace', E'ព្រះរាជដំណាក់របស់ព្រះមហាក្សត្រ និងវត្តព្រះកែវមរកតនៅក្បែរនោះ។\n\nខ្សែតភ្ជាប់ច្បាស់បំផុត ពីរាជវាំងសម័យអង្គររហូតដល់សព្វថ្ងៃ។', E'ព្រះរាជដំណាក់របស់ព្រះមហាក្សត្រ និងវត្តព្រះកែវមរកតនៅក្បែរនោះ។\n\nទីកន្លែងដែលបង្ហាញយ៉ាងច្បាស់ពីការបន្តវេននៃរាជវាំង ចាប់ពីសម័យអង្គររហូតដល់សព្វថ្ងៃ។')
              ) AS v (slug, was, next)
              WHERE v.slug = d.slug AND d.description_km = v.was;
      rollback:
        - sql:
            splitStatements: true
            sql: |
              UPDATE destination.destinations d SET name_km = v.next FROM (VALUES
                ('battambang-art-quarter', E'តំបន់សិល្បៈបាត់ដំបង', E'សង្កាត់សិល្បៈបាត់ដំបង'),
                ('phnom-penh-coffee-quarter', E'តំបន់ហាងកាហ្វេភ្នំពេញ', E'សង្កាត់កាហ្វេភ្នំពេញ'),
                ('angkorian-royal-road', E'ផ្លូវរាជសម័យអង្គរ', E'ផ្លូវហ្លួងសម័យអង្គរ')
              ) AS v (slug, was, next)
              WHERE v.slug = d.slug AND d.name_km = v.was;

              UPDATE destination.destinations d SET description_km = v.next FROM (VALUES
                ('kampot-riverfront', E'ជួរផ្ទះល្វែងដែលបានជួសជុលឡើងវិញ បែរមុខទៅទន្លេដែលហូរយឺតៗ និងខ្នងភ្នំបូកគោ។\n\nជិះទូកមើលថ្ងៃលិច ហើយរីករាយនឹងទេសភាពភ្នំបូកគោពីលើទន្លេ។', E'ជួរផ្ទះល្វែងដែលបានជួសជុលឡើងវិញ បែរមុខទៅទន្លេដែលហូរយឺតៗ និងខ្នងភ្នំបូកគោ។\n\nជិះទូកមើលថ្ងៃលិច — ភ្នំនឹងធ្វើផ្នែកដែលនៅសល់។'),
                ('chi-phat', E'ភូមិមួយនៅជួរភ្នំក្រវាញ ដែលបានងាកចេញពីការកាប់ឈើ និងការបរបាញ់សត្វខុសច្បាប់ មកដំណើរការអេកូទេសចរណ៍ផ្ទាល់ខ្លួន។\n\nកក់តាមរយៈការិយាល័យសហគមន៍ក្នុងភូមិ ព្រោះសហគមន៍ជាអ្នករៀបចំ និងទទួលផលពីទេសចរណ៍ទាំងអស់។', E'ភូមិមួយនៅជួរភ្នំក្រវាញ ដែលបានងាកចេញពីការកាប់ឈើ និងការបរបាញ់សត្វខុសច្បាប់ មកដំណើរការអេកូទេសចរណ៍ផ្ទាល់ខ្លួន។\n\nកក់តាមរយៈការិយាល័យសហគមន៍ក្នុងភូមិ។ នោះហើយជាគំរូទាំងមូល។'),
                ('koh-ker', E'ធ្លាប់ជារាជធានីត្រឹមតែម្ភៃឆ្នាំ ហើយប្រាសាទកំពូលភ្នំប្រាំពីរជាន់ (ប្រាសាទធំ) នៅតែជាសក្ខីភាព។\n\nរាជធានីអាយុកាលខ្លីរបស់ចក្រភពខ្មែរ ដែលស្ថិតនៅស្ងាត់ៗក្នុងព្រៃ។', E'រាជធានីតែម្ភៃឆ្នាំប៉ុណ្ណោះ និងប្រាសាទពីរ៉ាមីតប្រាំពីរជាន់ជាភស្តុតាង។\n\nការសាកល្បងដ៏ខ្លីរបស់ចក្រភពមួយ ស្ថិតនៅតែឯងក្នុងព្រៃ។'),
                ('battambang-art-quarter', E'មជ្ឈមណ្ឌលសិល្បៈនៃកម្ពុជា — វិចិត្រសាល សាលាសៀក និងស្ទូឌីយោសិប្បកម្ម ក្នុងផ្ទះល្វែងមាត់ស្ទឹង។\n\nផ្លូវផ្ទះល្វែងដែលរក្សាបានល្អបំផុតក្នុងប្រទេស ដោយមានវិចិត្រសាលនៅពីក្រោយទ្វាររបាំង។', E'រាជធានីសិល្បៈនៃកម្ពុជា — វិចិត្រសាល សាលាសៀក និងស្ទូឌីយោសិប្បកម្ម ក្នុងផ្ទះល្វែងមាត់ស្ទឹង។\n\nផ្លូវផ្ទះល្វែងដែលរក្សាបានល្អបំផុតក្នុងប្រទេស ដោយមានវិចិត្រសាលនៅពីក្រោយទ្វាររបាំង។'),
                ('koh-rong', E'ឆ្នេរខ្សាច់សវែងៗ ទឹកសមុទ្រភ្លឺចែងចាំងពេលយប់ និងផ្លូវកៅស៊ូតិចតួចបំផុត។\n\nហែលទឹកពេលយប់នៅឆ្នេរខាងកើត — ទឹកសមុទ្រនឹងភ្លឺចែងចាំងជុំវិញខ្លួនអ្នក។', E'ឆ្នេរខ្សាច់សវែងៗ ទឹកសមុទ្រភ្លឺចែងចាំងពេលយប់ និងផ្លូវកៅស៊ូតិចតួចបំផុត។\n\nហែលទឹកក្រោយពេលងងឹតនៅឆ្នេរខាងកើត — ប្លង់តុងភ្លឺចែងចាំង។'),
                ('kampot-pepper-farm', E'ម្រេចកំពតដែលមានសញ្ញាសម្គាល់ភូមិសាស្ត្រ បេះដោយដៃ និងញែកតាមពណ៌។\n\nភ្លក់ម្រេចខ្ចីដែលទើបបេះពីដើមស្រស់ៗ យ៉ាងហោចណាស់ម្ដង។', E'វល្លិម្រេចដែលមានការការពារប្រភពដើម បេះដោយដៃ និងញែកតាមពណ៌។\n\nភ្លក់ម្រេចខ្ចីដែលទើបបេះពីដើមស្រស់ៗ យ៉ាងហោចណាស់ម្ដង។'),
                ('angkorian-royal-road', E'ផ្លូវរាជប្រវែង ២២៥ គីឡូម៉ែត្រ ពីអង្គរឆ្ពោះទៅទិសខាងកើតរហូតដល់បាកាន ជាមួយស្ពាន ផ្ទះភ្លើង និងវិហារអារោគ្យសាលា។\n\nចក្រភពមួយងាយយល់បំផុតតាមរយៈផ្លូវថ្នល់របស់វា។', E'ផ្លូវហ្លួងប្រវែង ២២៥ គីឡូម៉ែត្រ ពីអង្គរឆ្ពោះទៅទិសខាងកើតរហូតដល់បាកាន ជាមួយស្ពាន ផ្ទះភ្លើង និងវិហារអារោគ្យសាលា។\n\nចក្រភពមួយងាយយល់បំផុតតាមរយៈផ្លូវថ្នល់របស់វា។'),
                ('preah-vihear-temple', E'ប្រាសាទដែលលាតសន្ធឹងតាមអ័ក្សប្រវែង ៨០០ ម៉ែត្រ នៅលើគែមច្រាំងថ្មនៃជួរភ្នំដងរែក។\n\nដំណើរឡើងទៅដល់ប្រាសាទ គឺជាបទពិសោធន៍ដ៏សំខាន់ — សូមឡើងយឺតៗ ហើយរីករាយនឹងទេសភាព។', E'ប្រាសាទដែលលាតសន្ធឹងតាមអ័ក្សប្រវែង ៨០០ ម៉ែត្រ នៅលើគែមច្រាំងថ្មនៃជួរភ្នំដងរែក។\n\nផ្លូវឡើងទៅដល់ គឺជាចំណុចសំខាន់ — ឡើងយឺតៗ។'),
                ('song-saa-private-island', E'កោះតូចពីរភ្ជាប់គ្នាដោយស្ពានថ្មើរជើង និងតំបន់អភិរក្សសមុទ្រដែលត្រូវបានការពារ។\n\nភាពប្រណីតដែលជួយផ្ដល់ថវិកាដល់ការអភិរក្ស — ថ្លៃការពារថ្មប៉ប្រះទឹកជួយថែរក្សាសមុទ្រជុំវិញកោះ។', E'កោះតូចពីរភ្ជាប់គ្នាដោយស្ពានថ្មើរជើង និងតំបន់អភិរក្សសមុទ្រដែលត្រូវបានការពារ។\n\nភាពប្រណីតដែលផ្ដល់ថវិកាដល់ការអភិរក្ស — ថ្លៃការពារថ្មប៉ប្រះទឹក គឺជាចំណុចសំខាន់។'),
                ('mekong-discovery-trail', E'ផ្លូវជិះកង់តាមមាត់ទន្លេ កាត់តាមចម្ការកៅស៊ូ និងភូមិនៅលើកោះ។\n\nជិះជាដំណាក់ៗ — ការឆ្លងសាឡាងក៏ជាផ្នែកមួយនៃភាពសប្បាយដែរ។', E'ផ្លូវជិះកង់តាមមាត់ទន្លេ កាត់តាមចម្ការកៅស៊ូ និងភូមិនៅលើកោះ។\n\nជិះជាដំណាក់ៗ — ការជិះសាឡាងគឺជាពាក់កណ្ដាលនៃភាពរីករាយ។'),
                ('tatai-waterfall', E'ទឹកធ្លាក់ធំទូលាយលើស្ទឹងតាតៃ នៅគែមភាគខាងត្បូងនៃជួរភ្នំក្រវាញ។\n\nជិះទូកពីស្ពាន។ ដំណើរតាមទន្លេក៏ជាបទពិសោធន៍ដ៏ស្រស់ស្អាតមួយដែរ។', E'ទឹកធ្លាក់ធំទូលាយលើស្ទឹងតាតៃ នៅគែមភាគខាងត្បូងនៃជួរភ្នំក្រវាញ។\n\nជិះទូកពីស្ពាន។ ការធ្វើដំណើរតាមទន្លេ គឺជាពាក់កណ្ដាលនៃភាពរីករាយ។'),
                ('battambang-bamboo-train', E'កម្រាលឫស្សីដាក់លើកង់រថភ្លើង រត់តាមផ្លូវដែកតែមួយដែលកោងរៀច។\n\nមធ្យោបាយធ្វើដំណើរដែលអ្នកស្រុកច្នៃប្រឌិតខ្លួនឯង ហើយនៅតែដំណើរការ ទោះបីរថភ្លើងពិតលែងរត់ក៏ដោយ។', E'កម្រាលឫស្សីដាក់លើកង់រថភ្លើង រត់តាមផ្លូវដែកតែមួយដែលកោងរៀច។\n\nមធ្យោបាយធ្វើដំណើរច្នៃប្រឌិត ដែលនៅរស់រានយូរជាងផ្លូវដែកដែលខ្លួនខ្ចីប្រើ។'),
                ('elephant-valley-project', E'ជម្រកមួយដែលដំរីធ្វើការចូលនិវត្តន៍ ត្រូវបានគេនាំដើរ មិនមែនជិះទេ។\n\nមើល មិនមែនជិះ — ការទស្សនាគោរពតាមសេរីភាព និងសុខុមាលភាពរបស់ដំរី។', E'ជម្រកមួយដែលដំរីធ្វើការចូលនិវត្តន៍ ត្រូវបានគេនាំដើរ មិនមែនជិះទេ។\n\nមើល មិនមែនជិះ — ការទស្សនាធ្វើឡើងតាមចិត្តរបស់ដំរី។'),
                ('num-banh-chok-markets', E'តូបពេលព្រឹកដែលលក់នំបញ្ចុក ជាអាហារពេលព្រឹកប្រចាំជាតិរបស់កម្ពុជា ដែលគេធ្វើស្រស់ៗ ហើយចាក់សម្លតាមការកុម្ម៉ង់។\n\nអស់មុនម៉ោងប្រាំបួន។ បន្លែស្រស់ដាក់ពីលើ គឺត្រូវតែមាន។', E'តូបពេលព្រឹកដែលអាហារពេលព្រឹកជាតិរបស់កម្ពុជា ត្រូវបានគេបញ្ចុក ស្ងោរ និងចាក់សម្លតាមការកុម្ម៉ង់។\n\nអស់មុនម៉ោងប្រាំបួន។ បន្លែស្រស់ដាក់ពីលើ គឺត្រូវតែមាន។'),
                ('ta-prohm', E'អារាមមួយដែលត្រូវបានទុកឱ្យឫសដើមឈើធំៗរុំព័ទ្ធ ដោយចេតនាមិនជួសជុល។\n\nប្រាសាទតែមួយគត់ដែលគេទុកឱ្យដើមឈើ និងព្រៃនៅជាប់នឹងប្រាសាទដដែល។', E'អារាមមួយដែលត្រូវបានទុកឱ្យឫសដើមឈើធំៗរុំព័ទ្ធ ដោយចេតនាមិនជួសជុល។\n\nប្រាសាទតែមួយគត់ដែលព្រៃឈើត្រូវបានអនុញ្ញាតឱ្យរក្សាការគ្រប់គ្រងរបស់វា។'),
                ('royal-palace', E'ព្រះរាជដំណាក់របស់ព្រះមហាក្សត្រ និងវត្តព្រះកែវមរកតនៅក្បែរនោះ។\n\nទីកន្លែងដែលបង្ហាញយ៉ាងច្បាស់ពីការបន្តវេននៃរាជវាំង ចាប់ពីសម័យអង្គររហូតដល់សព្វថ្ងៃ។', E'ព្រះរាជដំណាក់របស់ព្រះមហាក្សត្រ និងវត្តព្រះកែវមរកតនៅក្បែរនោះ។\n\nខ្សែតភ្ជាប់ច្បាស់បំផុត ពីរាជវាំងសម័យអង្គររហូតដល់សព្វថ្ងៃ។')
              ) AS v (slug, was, next)
              WHERE v.slug = d.slug AND d.description_km = v.was;
