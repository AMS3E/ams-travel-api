# The partner, dissolved into the listings it existed to create.
#
# A partner was a business row with a membership table beside it, and the only
# question either ever answered was "may this person write this stay?". A
# partner is an account a BDO signs up, and that account runs its own listings,
# so the listing can simply name the person who runs it. Two tables, a schema
# and a join go; one column and a contact address stay.
#
# Nothing is copied: both partner tables and both listing tables are empty.
databaseChangeLog:
  - changeSet:
      id: v2-destination-listing-owner
      author: ams-travel-v2
      changes:
        # The listings first: their key into partner has to go before it does.
        - dropForeignKeyConstraint:
            baseTableSchemaName: destination
            baseTableName: destination_stays
            constraintName: fk_destination_stays_partner
        - dropForeignKeyConstraint:
            baseTableSchemaName: destination
            baseTableName: destination_foods
            constraintName: fk_destination_foods_partner
        - dropIndex: {schemaName: destination, tableName: destination_stays, indexName: idx_destination_stays_partner}
        - dropIndex: {schemaName: destination, tableName: destination_foods, indexName: idx_destination_foods_partner}

        # The business is the person now, so the column says whose listing it is.
        - renameColumn:
            schemaName: destination
            tableName: destination_stays
            oldColumnName: partner_id
            newColumnName: owner_user_id
            columnDataType: uuid
        - renameColumn:
            schemaName: destination
            tableName: destination_foods
            oldColumnName: partner_id
            newColumnName: owner_user_id
            columnDataType: uuid

        # The one thing a partner held that neither listing already had.
        - addColumn:
            schemaName: destination
            tableName: destination_stays
            columns:
              - column: {name: contact_email, type: varchar(255)}
        - addColumn:
            schemaName: destination
            tableName: destination_foods
            columns:
              - column: {name: contact_email, type: varchar(255)}

        - createIndex:
            schemaName: destination
            tableName: destination_stays
            indexName: idx_destination_stays_owner
            columns:
              - column: {name: owner_user_id}
        - createIndex:
            schemaName: destination
            tableName: destination_foods
            indexName: idx_destination_foods_owner
            columns:
              - column: {name: owner_user_id}

        # A deleted account leaves its listings; an editor picks them up.
        - addForeignKeyConstraint:
            baseTableSchemaName: destination
            baseTableName: destination_stays
            baseColumnNames: owner_user_id
            constraintName: fk_destination_stays_owner
            referencedTableSchemaName: auth
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableSchemaName: destination
            baseTableName: destination_foods
            baseColumnNames: owner_user_id
            constraintName: fk_destination_foods_owner
            referencedTableSchemaName: auth
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL

        # And the partner itself, membership first.
        - dropTable: {schemaName: partner, tableName: partner_users}
        - dropTable: {schemaName: partner, tableName: partners}
        - sql:
            sql: DROP SCHEMA IF EXISTS partner CASCADE
      rollback:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS partner
        - createTable:
            schemaName: partner
            tableName: partners
            columns:
              - column: {name: id, type: uuid, defaultValueComputed: "${fn.uuid}", constraints: {primaryKey: true, primaryKeyName: partners_pkey, nullable: false}}
              - column: {name: name, type: varchar(255), constraints: {nullable: false}}
              - column: {name: slug, type: varchar(100), constraints: {nullable: false, unique: true, uniqueConstraintName: uk_partners_slug}}
              - column: {name: type, type: varchar(50), constraints: {nullable: false}}
              - column: {name: contact_email, type: varchar(255)}
              - column: {name: contact_phone, type: varchar(50)}
              - column: {name: logo_key, type: varchar(512)}
              - column: {name: status, type: varchar(30), defaultValue: ACTIVE, constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
              - column: {name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
        - createTable:
            schemaName: partner
            tableName: partner_users
            columns:
              - column: {name: id, type: uuid, defaultValueComputed: "${fn.uuid}", constraints: {primaryKey: true, primaryKeyName: partner_users_pkey, nullable: false}}
              - column: {name: partner_id, type: uuid, constraints: {nullable: false}}
              - column: {name: user_id, type: uuid, constraints: {nullable: false}}
              - column: {name: role, type: varchar(50), constraints: {nullable: false}}
              - column: {name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: {nullable: false}}
        - dropColumn: {schemaName: destination, tableName: destination_stays, columnName: contact_email}
        - dropColumn: {schemaName: destination, tableName: destination_foods, columnName: contact_email}
        - renameColumn: {schemaName: destination, tableName: destination_stays, oldColumnName: owner_user_id, newColumnName: partner_id, columnDataType: uuid}
        - renameColumn: {schemaName: destination, tableName: destination_foods, oldColumnName: owner_user_id, newColumnName: partner_id, columnDataType: uuid}
