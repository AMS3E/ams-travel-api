  - include: { file: v2/destination/009-stay-interests.yaml, relativeToChangelogFile: true }
  - include: { file: v2/destination/010-stay-rooms.yaml, relativeToChangelogFile: true }
  - include: { file: v2/destination/011-stay-house-rules.yaml, relativeToChangelogFile: true }
