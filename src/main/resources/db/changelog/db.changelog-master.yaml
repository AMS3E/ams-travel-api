# AMS Travel database: the 41-table ERD in 8 schemas, plus the tables of the
# features restored beside it — history & heritage (schema `history`), the
# season calendar, and destination verification.
#
# Order matters: legacy tables go first, then the schemas, then each schema's
# tables (only their own foreign keys), then the foreign keys that cross
# schemas, PostgreSQL-only indexes, and the reference rows the API relies on.
databaseChangeLog:
  # What differs between PostgreSQL (the app) and H2 (the test run).
  - property: {name: fn.uuid, value: gen_random_uuid(), dbms: postgresql}
  - property: {name: fn.uuid, value: random_uuid(), dbms: h2}
  - property: {name: type.json, value: jsonb, dbms: postgresql}
  - property: {name: type.json, value: json, dbms: h2}
  - property: {name: type.inet, value: inet, dbms: postgresql}
  - property: {name: type.inet, value: varchar(45), dbms: h2}

  # The tables, in the order their foreign keys allow.
  - include: { file: v2/000-drop-legacy.yaml, relativeToChangelogFile: true }
  - include: { file: v2/001-schemas.yaml, relativeToChangelogFile: true }
  - include: { file: v2/auth/001-tables.yaml, relativeToChangelogFile: true }
  - include: { file: v2/partner/001-tables.yaml, relativeToChangelogFile: true }
  - include: { file: v2/taxonomy/001-tables.yaml, relativeToChangelogFile: true }
  - include: { file: v2/taxonomy/002-tourism-regions.yaml, relativeToChangelogFile: true }
  - include: { file: v2/destination/001-tables.yaml, relativeToChangelogFile: true }
  - include: { file: v2/publishing/001-tables.yaml, relativeToChangelogFile: true }
  - include: { file: v2/publishing/002-verifications.yaml, relativeToChangelogFile: true }
  - include: { file: v2/engagement/001-tables.yaml, relativeToChangelogFile: true }
  - include: { file: v2/gamification/001-tables.yaml, relativeToChangelogFile: true }
  - include: { file: v2/gamification/003-seasons.yaml, relativeToChangelogFile: true }
  - include: { file: v2/system/001-tables.yaml, relativeToChangelogFile: true }
  - include: { file: v2/history/001-tables.yaml, relativeToChangelogFile: true }
  - include: { file: v2/destination/003-stay-details.yaml, relativeToChangelogFile: true }
  - include: { file: v2/history/002-region-coverage.yaml, relativeToChangelogFile: true }
  - include: { file: v2/800-cross-schema-foreign-keys.yaml, relativeToChangelogFile: true }
  - include: { file: v2/810-postgresql-indexes.yaml, relativeToChangelogFile: true }
  # Last of the schema changes: it drops keys that 800 creates.
  - include: { file: v2/destination/004-listing-owner.yaml, relativeToChangelogFile: true }
  - include: { file: v2/destination/005-tourism-regions.yaml, relativeToChangelogFile: true }
  - include: { file: v2/taxonomy/005-corridor-itinerary.yaml, relativeToChangelogFile: true }
