# The AMS Travel backend on Dokploy: Postgres with PostGIS, Keycloak, MinIO and the API, with Dokploy's
# Traefik in front for the domains and HTTPS. No Mailpit here: production mail goes through a real
# account (the SMTP_* values). No host ports: Dokploy routes to the API and Keycloak by service name.
#
# In Dokploy: Create Service → Compose, from the ams-travel-api repo, branch kimleng, compose path
# deploy/docker-compose.dokploy.yml; paste deploy/.env.dokploy.example (filled in) into Environment;
# add the API and Keycloak domains under Domains. Step by step in deploy/DOKPLOY.md.
name: ams-travel

services:
  postgres:
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-ams-travel.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ams_travel"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    build: ./minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    build:
      context: ..
      target: keycloak
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL, e.g. https://auth.example.com}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      # What the entrypoint writes into the realm files: addresses, the mail account, the secrets.
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AMS Travel}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      WEBSITE_URL: ${WEBSITE_URL:?set WEBSITE_URL}
      DASHBOARD_URL: ${DASHBOARD_URL:?set DASHBOARD_URL}
      SSL_REQUIRED: ${KEYCLOAK_SSL_REQUIRED:-external}
      AMSTRAVEL_API_SECRET: ${AMSTRAVEL_API_SECRET:?set AMSTRAVEL_API_SECRET}
      AMSADMIN_API_SECRET: ${AMSADMIN_API_SECRET:?set AMSADMIN_API_SECRET}
      AMSADMIN_DASHBOARD_SECRET: ${AMSADMIN_DASHBOARD_SECRET:?set AMSADMIN_DASHBOARD_SECRET}
      LOCAL_USER_PASSWORD: ${LOCAL_USER_PASSWORD:?set LOCAL_USER_PASSWORD}
    networks:
      - default
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  api:
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ams_travel
      SPRING_DATASOURCE_USERNAME: ams_user
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      LIQUIBASE_ENABLED: "true"
      SEED_CATALOG: ${SEED_CATALOG:-true}
      SPRING_CACHE_TYPE: none
      OAUTH2_ENABLED: "true"
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: amstravel
      KEYCLOAK_BACKOFFICE_REALM: amsadmin
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL}/realms/amstravel
      KEYCLOAK_BACKOFFICE_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL}/realms/amsadmin
      KEYCLOAK_ADMIN_ENABLED: "true"
      KEYCLOAK_CUSTOMER_CLIENT_SECRET: ${AMSTRAVEL_API_SECRET}
      KEYCLOAK_BACKOFFICE_CLIENT_SECRET: ${AMSADMIN_API_SECRET}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ams-travel-images
      MEDIA_PREPARE_FOLDERS: "true"
      CORS_ALLOWED_ORIGINS: ${WEBSITE_URL},${DASHBOARD_URL}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # The API's public origin, e.g. https://api.travel.ams.com.kh: a badge's share page link starts with it.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      # A staging reset: a token never used before (the date does well) wipes the seeded catalogue, staff edits to those
      # rows included, and seeds it afresh on the next start. Leave it empty once the content is real.
      SEED_RESET_TOKEN: ${SEED_RESET_TOKEN:-}
    networks:
      - default
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /v3/api-docs HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

networks:
  dokploy-network:
    external: true

volumes:
  postgres-data:
  minio-data:
